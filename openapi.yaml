        status:
          type: string
          enum: [ACTIVE, PENDING_REVIEW, SUSPENDED, DISABLED]
        qualityScore:
          type: string
          enum: [HIGH, MEDIUM, LOW, FLAGGED, UNKNOWN]
        messagingTier:
          type: string
          enum: [TIER_50, TIER_250, TIER_1K, TIER_2K, TIER_10K, TIER_100K, UNLIMITED, UNKNOWN]
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        lastHealthCheckAt:
          type: string
          format: date-time
          nullable: true
        provider: { type: string }
        createdAt:
          type: string
          format: date-time
          nullable: true
        messagesLast7d: { type: integer, format: int64 }
        messagesLast30d: { type: integer, format: int64 }
        deliveredLast30d: { type: integer, format: int64 }
        provisionedByArara: { type: boolean }
