  # ---------------------- AUTOMAÇÕES ----------------------
  /v1/automations:
    get:
      tags: [Automações]
      operationId: listAutomations
      summary: Listar automações
      description: |
        Todas as automações da organização, sem paginação. Exige plano com
        recuperação de receita. Permissão: `READ`.
      responses:
        '200':
          description: Automações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Automation'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Automações]
      operationId: createAutomation
      summary: Criar automação
      description: |
        A automação nasce sempre desligada (`active: false`). Criar não conta no
        teto de automações ativas do plano; ligar conta. Ligue com
        `PUT /v1/automations/{id}/active`.

        Com `Idempotency-Key`, repetir a chamada devolve a automação já criada.

        Permissão: `AUTOMATIONS_MANAGE`. Essa permissão é opcional na chave:
        chaves antigas não têm.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationUpsertRequest'
            examples:
              carrinho:
                summary: Lembrete de carrinho abandonado
                value:
                  name: Lembrete de carrinho
                  trigger: cart.abandoned
                  steps:
                    - type: wait
                      config: { minutes: 60 }
                    - type: message
                      config:
                        templateId: 0b8f6c1e-7a52-4a1b-9a0e-3f2d6c9e1a44
                        variables: [nome]
              cobranca:
                summary: Cobrança com espera de pagamento
                value:
                  name: Cobrança do plano mensal
                  trigger: webhook
                  steps:
                    - type: message
                      config:
                        templateId: 0b8f6c1e-7a52-4a1b-9a0e-3f2d6c9e1a44
                        variables: [nome]
                    - type: wait_payment
                      config: { timeoutMinutes: 60 }
                      branches:
                        paid:
                          - type: tag
                            config: { tag: pagou }
                        unpaid:
                          - type: message
                            config:
                              templateId: 5d2a9b7c-1e44-4f0a-8c3b-6a7e2d1f9b10
                              variables: [nome]
      responses:
        '201':
          description: Automação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400': {$ref: '#/components/responses/AutomationInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/catalog:
    get:
      tags: [Automações]
      operationId: getAutomationCatalog
      summary: Listar gatilhos e tipos de passo
      description: |
        Catálogo de valores aceitos em `trigger` e `steps[].type`. Útil para
        validar do seu lado antes de criar. Permissão: `READ`.
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationCatalog'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/templates:
    get:
      tags: [Automações]
      operationId: listAutomationTemplates
      summary: Listar templates para automação
      description: |
        Só os templates aprovados, cada um com o preço de referência do envio.
        Use o `id` em `steps[].config.templateId`. Permissão: `READ`.
      responses:
        '200':
          description: Templates aprovados com preço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutomationTemplateOption'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/pricing:
    get:
      tags: [Automações]
      operationId: getAutomationPricing
      summary: Consultar preço da mensagem na janela
      description: |
        Preço de uma mensagem dentro da janela de 24h (texto, botões, lista) no
        plano da organização. Serve para somar o custo da automação antes de
        ligar. Permissão: `READ`.
      responses:
        '200':
          description: Preço
          content:
            application/json:
              schema:
                type: object
                required: [sessionUnitPriceBrl]
                properties:
                  sessionUnitPriceBrl:
                    type: number
                    description: Preço em reais.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/{id}:
    get:
      tags: [Automações]
      operationId: getAutomation
      summary: Consultar automação
      description: |
        Mesmo objeto da listagem, com `stats` e, no gatilho `webhook`, o objeto
        `hook` com o link próprio da automação. Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      responses:
        '200':
          description: Automação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AutomationNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Automações]
      operationId: updateAutomation
      summary: Atualizar automação
      description: |
        Substitui a automação inteira: nome, gatilho e a lista de passos. Não
        existe alteração parcial. Mande o objeto completo, como
        `GET /v1/automations/{id}` devolveu.

        Salvar uma automação ligada encerra as execuções que estão esperando
        resposta (`question`) ou pagamento (`wait_payment`), com
        `stoppedReason: "automação editada"`.

        Permissão: `AUTOMATIONS_MANAGE`.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationUpsertRequest'
      responses:
        '200':
          description: Automação atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400': {$ref: '#/components/responses/AutomationInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AutomationNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Automações]
      operationId: deleteAutomation
      summary: Apagar automação
      description: 'Apaga a automação e as execuções ligadas a ela. Permissão: `AUTOMATIONS_MANAGE`.'
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      responses:
        '204':
          description: Apagada
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AutomationNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/{id}/active:
    put:
      tags: [Automações]
      operationId: setAutomationActive
      summary: Ligar ou desligar automação
      description: |
        O teto de automações ativas do plano é conferido aqui, não na criação,
        e ignora a própria automação. Automação sem passos não liga
        (`400 AUTOMATION_EMPTY`). Desligar não derruba quem já está no meio da
        sequência, só impede gente nova de entrar.
        Permissão: `AUTOMATIONS_MANAGE`.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
                  description: '`true` liga, `false` desliga.'
            example:
              active: true
      responses:
        '200':
          description: Automação com o novo estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          description: '`AUTOMATION_EMPTY`: automação sem nenhum passo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {code: AUTOMATION_EMPTY, message: Adicione pelo menos um passo antes de ligar., details: {}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AutomationNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/{id}/runs:
    get:
      tags: [Automações]
      operationId: listAutomationRuns
      summary: Listar execuções da automação
      description: |
        Uma execução é uma pessoa atravessando a automação. Devolve
        `{ data, pagination }`. Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
        - $ref: '#/components/parameters/Page'
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, default: 20 }
          description: Itens por página.
      responses:
        '200':
          description: Página de execuções
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRunPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AutomationNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/{id}/runs/{runId}/events:
    get:
      tags: [Automações]
      operationId: listAutomationRunEvents
      summary: Listar eventos de uma execução
      description: |
        O rastro de uma execução, passo a passo. Responde por que uma pessoa
        parou onde parou. Devolve `{ data, pagination }`. Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
          description: ID da execução, como veio em `GET /v1/automations/{id}/runs`.
        - $ref: '#/components/parameters/Page'
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, default: 50 }
          description: Itens por página.
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRunEventPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: '`AUTOMATION_NOT_FOUND` ou `AUTOMATION_RUN_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {code: AUTOMATION_RUN_NOT_FOUND, message: Execução não encontrada., details: {}}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/{id}/hook/regenerate:
    post:
      tags: [Automações]
      operationId: regenerateAutomationHook
      summary: Gerar novo link da automação
      description: |
        Troca o token do link próprio da automação. O link antigo para de
        funcionar na hora. Só existe em automação com gatilho `webhook`
        (`409 HOOK_UNAVAILABLE_FOR_TRIGGER` nas demais).
        Permissão: `AUTOMATIONS_MANAGE`.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      responses:
        '200':
          description: Link novo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationHook'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AutomationNotFound'}
        '409': {$ref: '#/components/responses/HookUnavailable'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/automations/{id}/hook/signature:
    put:
      tags: [Automações]
      operationId: setAutomationHookSignature
      summary: Ligar ou desligar assinatura do link
      description: |
        Com a assinatura ligada, o link só aceita `POST` com o header
        `X-Arara-Signature` válido. O segredo vem **uma única vez**, na resposta
        de quem ligou. Guarde na hora. Permissão: `AUTOMATIONS_MANAGE`.
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: '`true` liga a assinatura. Ausente ou `false` desliga.'
            example:
              enabled: true
      responses:
        '200':
          description: Estado da assinatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationHookSignature'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AutomationNotFound'}
        '409': {$ref: '#/components/responses/HookUnavailable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: '`HOOK_SIGNATURE_UNAVAILABLE`: a assinatura não pôde ser configurada agora. Tente de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hooks/a/{token}:
    post:
      tags: [Automações]
      operationId: triggerAutomationHook
      summary: Acionar automação pelo link
      description: |
        Link próprio de uma automação com gatilho `webhook`. Não usa chave de
        API: o `token` na URL é a credencial. Trate o link como segredo.

        O mesmo link aceita dois corpos:

        - Com `phone`: inicia uma execução (`202`).
        - Com `referenceId` e `status` na raiz: atualiza o pagamento de uma
          cobrança já enviada (`200`), e a execução segue pelo ramo `paid` ou
          `unpaid` do passo `wait_payment`.

        Corpo de até 64 KB. Guia completo em
        [Link da automação e pagamento](/automacoes-webhook).
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
          description: Token do link (`ara_hook_...`), copiado da tela da automação ou do campo `hook.url`.
        - in: header
          name: X-Arara-Signature
          required: false
          schema: { type: string }
          description: Assinatura do corpo. Obrigatória quando a assinatura do link está ligada.
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
          description: Evita iniciar a mesma execução duas vezes. Use o id do evento no seu sistema (ex. o número do pedido).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/HookStartRequest'
                - $ref: '#/components/schemas/HookPaymentUpdateRequest'
            examples:
              iniciar:
                summary: Iniciar com cobrança por Pix
                value:
                  phone: '5511999999999'
                  variables: { nome: Maria }
                  charge:
                    referenceId: pedido-1042
                    method: pix
                    pixCode: 000201...
                    pixKey: '39580525000189'
                    pixKeyType: CNPJ
                    merchantName: Loja Exemplo
                    amountCents: 5990
                    description: Plano mensal
              pagamento:
                summary: Avisar que pagou
                value:
                  referenceId: pedido-1042
                  status: paid
      responses:
        '200':
          description: Pagamento atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookPaymentUpdated'
              example:
                referenceId: pedido-1042
                status: paid
                cardUpdated: true
                runResumed: true
        '202':
          description: Execução iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookStarted'
              example:
                runId: 7c1d2e90-4b3a-4c8e-9f21-5a6b7c8d9e01
                status: started
        '400':
          description: '`HOOK_PAYLOAD_INVALID`, `INVALID_CHARGE` ou `INVALID_CHARGE_STATUS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`HOOK_SIGNATURE_INVALID`: assinatura ausente ou errada com a assinatura ligada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`HOOK_SETTLEMENT_SIGNATURE_REQUIRED`: a baixa de pagamento exige a assinatura ligada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`HOOK_NOT_FOUND` (token inexistente ou trocado) ou `CHARGE_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`AUTOMATION_INACTIVE` (automação desligada), `CHARGE_AMOUNT_MISMATCH` ou `CHARGE_ALREADY_SETTLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`HOOK_PAYLOAD_TOO_LARGE`: corpo acima de 64 KB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Limite de chamadas do link. Respeite `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Segundos a aguardar antes de tentar de novo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

