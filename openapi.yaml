    UpdateSmartLinkRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        defaultText:
          type: string
          nullable: true
        qrCodeColor:
          type: string
          nullable: true

    SmartLinkResponse:
      type: object
      required: [id, name, phoneNumber, qrCodeColor, code, shortUrl, clicks]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phoneNumber: { type: string }
        defaultText:
          type: string
          nullable: true
        qrCodeColor: { type: string }
        code: { type: string }
        shortUrl:
          type: string
          description: URL pública (`.../l/{code}`).
