        readCount: 38900
        failedCount: 900
        clickedCount: 4120
        convertedCount: 312
        convertedValue: 87650.0
        replyCount: 1840
        holdoutCount: 0
        blockedCount: 600
        blockReasons:
          - motivo: Contato pediu para não receber
            quantidade: 600
        refundCount: 1500
        refundValue: 575.25
        totalCost: 19175.0
        scheduledAt: null
        startedAt: '2026-11-27T18:00:12Z'
        finishedAt: '2026-11-27T18:23:14Z'
        createdAt: '2026-11-27T18:00:00Z'

    CampaignEstimateRequest:
      type: object
      required: [templateName, phones]
      properties:
        templateName:
          type: string
          description: Nome ou ID do template.
        phones:
          type: array
          minItems: 1
          items: { type: string }
          description: Telefones E.164 com `+`. O preço é calculado por país de destino.

    CampaignEstimateResponse:
      type: object
