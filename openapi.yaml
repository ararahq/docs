          description: Preenchido só quando o formulário foi criado mas a publicação falhou.
        createdAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 0b7e6a52-3c1d-4f7a-9a55-2f4f6f1f9c10
        name: Captar contato
        category: LEAD_GENERATION
        status: PUBLISHED
        definition:
          title: Fale com a gente
          intro: Leva menos de um minuto.
          submitLabel: Enviar
          fields:
            - {key: nome, label: Seu nome, type: TEXT, required: true, options: []}
            - {key: email, label: Seu melhor e-mail, type: EMAIL, required: true, options: []}
            - key: interesse
              label: O que você procura?
              type: SELECT
              required: true
              options:
                - {id: falar_com_vendas, title: Falar com vendas}
                - {id: suporte, title: Suporte}
        responseCount: 42
        publishError: null
        createdAt: '2026-09-15T14:30:00Z'
        publishedAt: '2026-09-15T14:30:04Z'

