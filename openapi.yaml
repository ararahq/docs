  # ---------- Automações ----------
    AutomationStep:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [message, wait, condition, tag, question, wait_payment]
          description: |
            - `message`: envia um template (`templateId`, `variables` e,
              opcionalmente, `charge`) ou um texto na janela de 24h
              (`sessionText`, até 1.024 caracteres). Nunca os dois.
            - `wait`: `{ "minutes": N }`, de 1 a 43.200 (30 dias).
            - `condition`: `{ "tag": "..." }`. Segue só se o contato ainda não
              tem a etiqueta.
            - `tag`: `{ "tag": "..." }`. Aplica a etiqueta no contato.
            - `question`: pergunta com opções; ramifica em `branches`.
            - `wait_payment`: `{ "timeoutMinutes": N, "referenceId"?: "..." }`;
              ramifica em `paid` e `unpaid`.
        config:
          type: object
          nullable: true
          additionalProperties: true
          description: Configuração do passo. O formato depende de `type`.
        branches:
          type: object
          nullable: true
          description: |
            Só em `question` e `wait_payment`. Chave do ramo para a lista de
            passos daquele ramo. Em `question`: o `id` de cada opção, mais
            `__timeout` e `__other`. Em `wait_payment`: `paid` e `unpaid`.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AutomationStep'
        id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: ID do passo na resposta. Muda a cada `PUT`.

    AutomationUpsertRequest:
      type: object
      required: [name, trigger]
      properties:
        name:
          type: string
          description: Nome interno da automação.
        trigger:
          type: string
          enum: [webhook, cart.abandoned, payment.failed, tag.applied, conversation.started, button.replied, charge.paid, charge.expired]
          description: |
            Gatilho que coloca um contato na automação. `webhook` é o link
            próprio da automação; `cart.abandoned` e `payment.failed` vêm da
            recuperação de receita; os demais são eventos internos da Arara.
        triggerConfig:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Só `button.replied` exige: `{ "replyId": "...", "templateName"?: "..." }`. Os demais gatilhos ignoram o campo.'
        steps:
          type: array
          default: []
          description: Passos, na ordem de execução. A lista inteira é reescrita a cada `POST` ou `PUT`.
          items:
            $ref: '#/components/schemas/AutomationStep'

    AutomationHook:
      type: object
      required: [url, signatureEnabled, hasSecret]
      properties:
        url:
          type: string
          description: Link próprio da automação (`https://api.ararahq.com/hooks/a/ara_hook_...`).
        signatureEnabled: { type: boolean }
        hasSecret:
          type: boolean
          description: Diz só se o segredo existe. O valor nunca volta em leitura.

    AutomationHookSignature:
      type: object
      required: [url, signatureEnabled, hasSecret]
      properties:
        url: { type: string }
        signatureEnabled: { type: boolean }
        hasSecret: { type: boolean }
        secret:
          type: string
          nullable: true
          description: Segredo da assinatura. Vem preenchido uma única vez, na resposta de quem ligou.

    Automation:
      type: object
      required: [id, name, trigger, active, steps, costPerRunBrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        trigger: { type: string }
        triggerConfig:
          type: object
          nullable: true
          additionalProperties: true
        active:
          type: boolean
          description: '`false` na criação. Mude em `PUT /v1/automations/{id}/active`.'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AutomationStep'
        costPerRunBrl:
          type: number
          description: Custo estimado, em reais, de cada pessoa que entrar na automação.
        stats:
          type: object
          nullable: true
          properties:
            runsLast30Days: { type: integer, format: int64 }
            inFlight: { type: integer, format: int64 }
            completed: { type: integer, format: int64 }
            stopped: { type: integer, format: int64 }
        webhookUrl:
          type: string
          nullable: true
          description: URL que o seu sistema precisa chamar, quando o gatilho depende disso.
        hook:
          allOf:
            - $ref: '#/components/schemas/AutomationHook'
          nullable: true
          description: Só no gatilho `webhook`.
      example:
        id: 3d5a1f0c-6b2e-4c8d-9a41-0e1f2a3b4c5d
        name: Lembrete de carrinho
        trigger: cart.abandoned
        triggerConfig: null
        active: false
        steps:
          - id: b2f0c1de-1a2b-4c3d-8e4f-5a6b7c8d9e0f
            type: wait
            config: { minutes: 60 }
          - id: c7a1e2d3-4b5c-4d6e-9f70-8a9b0c1d2e3f
            type: message
            config:
              templateId: 0b8f6c1e-7a52-4a1b-9a0e-3f2d6c9e1a44
              variables: [nome]
        costPerRunBrl: 0.38
        stats: { runsLast30Days: 0, inFlight: 0, completed: 0, stopped: 0 }
        webhookUrl: null
        hook: null

    AutomationCatalog:
      type: object
      required: [triggers, stepTypes]
      properties:
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/AutomationCatalogEntry'
        stepTypes:
          type: array
          items:
            $ref: '#/components/schemas/AutomationCatalogEntry'

    AutomationCatalogEntry:
      type: object
      required: [value, internal]
      properties:
        value:
          type: string
          description: Valor aceito em `trigger` ou `steps[].type`.
        internal:
          type: boolean
          description: '`true` quando o evento nasce dentro da Arara, sem integração do seu lado.'

    AutomationTemplateOption:
      type: object
      required: [id, name, category, unitPriceBrl, hasChargeButton]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        unitPriceBrl:
          type: number
          description: Preço de referência do envio deste template, em reais.
        hasChargeButton:
          type: boolean
          description: Template de cobrança. O passo precisa informar a cobrança.

    AutomationRun:
      type: object
      required: [id, phoneNumber, status]
      properties:
        id: { type: string, format: uuid }
        phoneNumber: { type: string }
        status:
          type: string
          enum: [RUNNING, WAITING_REPLY, COMPLETED, STOPPED, FAILED]
        currentStepId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        stoppedReason:
          type: string
          nullable: true

    AutomationRunPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutomationRun'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AutomationRunEvent:
      type: object
      required: [id, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        stepId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          description: 'Tipo do evento, ex.: `STARTED`, `QUESTION_ASKED`, `REPLY_MATCHED`, `CHARGE_SENT`, `COMPLETED`.'
        detail:
          type: object
          nullable: true
          additionalProperties: true
          description: Muda conforme o `kind`.
        createdAt: { type: string, format: date-time }

    AutomationRunEventPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutomationRunEvent'
        pagination:
          $ref: '#/components/schemas/Pagination'

    HookStartRequest:
      type: object
      required: [phone]
      title: Iniciar execução
      properties:
        phone:
          type: string
          description: Telefone do cliente, com DDI.
          example: '5511999999999'
        variables:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Variáveis da execução, usadas como `{{nome}}` nos passos.
        charge:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Cobrança que o passo de cobrança da automação vai enviar.
            `referenceId` é o seu número da cobrança: é com ele que você avisa o
            pagamento depois. Campos em [Link da automação e pagamento](/automacoes-webhook).

    HookPaymentUpdateRequest:
      type: object
      required: [referenceId, status]
      title: Atualizar pagamento
      properties:
        referenceId:
          type: string
          description: O mesmo `charge.referenceId` enviado ao iniciar.
        status:
          type: string
          description: 'Novo estado da cobrança, ex.: `paid`.'
          example: paid

    HookStarted:
      type: object
      required: [status]
      properties:
        runId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          example: started

    HookPaymentUpdated:
      type: object
      required: [referenceId, status, cardUpdated, runResumed]
      properties:
        referenceId: { type: string }
        status: { type: string }
        cardUpdated:
          type: boolean
          description: '`true` quando a janela de 24h permitiu atualizar o cartão no WhatsApp.'
        runResumed:
          type: boolean
          description: '`true` quando havia uma execução esperando esse pagamento.'
