    # ---------- Campaigns ----------
          description: Idioma do item da biblioteca.

    CampaignStatus:
      type: string
      enum: [SCHEDULED, INGESTING, AB_TESTING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED, CANCELED]
      description: |
        - `SCHEDULED`: agendada, aguardando o horário.
        - `INGESTING`: processando contatos e enfileirando envios.
        - `AB_TESTING`: teste A/B em andamento.
        - `COMPLETED`: todos os contatos processados.
        - `COMPLETED_WITH_ERRORS`: processada, com contatos bloqueados.
        - `FAILED`: falha geral no processamento.
        - `CANCELED`: cancelada.

    CampaignRequest:
      type: object
      required: [name, templateName, contacts]
      properties:
        name:
          type: string
          description: Nome interno da campanha.
        templateName:
          type: string
          description: Nome ou ID do template aprovado. Com `abTest`, é a variante A.
        sender:
          type: string
          nullable: true
          description: Número que envia. Omitido, usa o padrão da organização.
        contacts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CampaignContactRequest'
          description: Destinatários, no mínimo 1.
        abTest:
          $ref: '#/components/schemas/CampaignAbConfig'
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Agenda o envio (ISO 8601), entre 5 minutos e 30 dias no futuro.

    CampaignContactRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: Telefone E.164 com `+`.
          example: '+5511999999999'
        variables:
          type: array
          default: []
          items: { type: string }
          description: Variáveis posicionais do template, em **array** (`["João", "30"]`), não em objeto.

    CampaignAbConfig:
      type: object
      required: [variantBTemplateName]
      properties:
        variantBTemplateName:
          type: string
          description: Template da variante B.
        metric:
          type: string
          enum: [DELIVERED, READ, CLICKED, CONVERTED]
          default: CLICKED
          description: Métrica que decide a vencedora.
        samplePct:
          type: integer
          default: 20
          description: Porcentagem dos contatos que entra no teste. O restante espera a vencedora.
        splitPct:
          type: integer
          minimum: 1
          maximum: 99
          default: 50
          description: Divisão entre A e B dentro da amostra, de 1 a 99.
        decisionWindowMinutes:
          type: integer
          default: 240
          description: Minutos até decidir a vencedora.
        autopilot:
          type: boolean
          default: true
          description: Envia o restante pela vencedora automaticamente.

    CampaignResponse:
      type: object
      required: [id, name, status, totalMessages, totalCost]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          $ref: '#/components/schemas/CampaignStatus'
        totalMessages: { type: integer }
        totalCost:
          type: number
          description: Valor já debitado da carteira, em reais. Os valores dos exemplos são ilustrativos.
        scheduledAt:
          type: string
          format: date-time
          nullable: true

      example:
        id: 7b3789fb-4c5d-6789-abcd-ef0123456789
        name: Black Friday 2026
        status: INGESTING
        totalMessages: 2
        totalCost: 0.767
        scheduledAt: null

    CampaignListItem:
      type: object
      required: [id, name, status, templateName, totalMessages, sentCount, deliveredCount, readCount, failedCount, totalCost]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        templateName: { type: string }
        totalMessages: { type: integer }
        sentCount: { type: integer }
        deliveredCount: { type: integer }
        readCount: { type: integer }
        failedCount: { type: integer }
        totalCost: { type: number }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true

    CampaignListResponse:
      type: object
      required: [content, totalPages, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CampaignListItem'
        totalPages: { type: integer }
        totalElements: { type: integer, format: int64 }
      example:
        content:
          - id: 7b3789fb-4c5d-6789-abcd-ef0123456789
            name: Black Friday 2026
            status: COMPLETED
            templateName: bf_oferta_geral
            totalMessages: 50000
            sentCount: 48500
            deliveredCount: 47200
            readCount: 38900
            failedCount: 900
            totalCost: 19175.0
            scheduledAt: null
            createdAt: '2026-11-27T18:00:00Z'
        totalPages: 1
        totalElements: 1

    CampaignDetailResponse:
      type: object
      required: [id, name, status, templateName, totalMessages, sentCount, deliveredCount, readCount, failedCount, clickedCount, convertedCount, convertedValue, totalCost]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        templateName: { type: string }
        templateBody:
          type: string
          nullable: true
        totalMessages: { type: integer }
        sentCount: { type: integer }
        deliveredCount: { type: integer }
        readCount: { type: integer }
        failedCount: { type: integer }
        clickedCount:
          type: integer
          description: Cliques em smart links da campanha.
