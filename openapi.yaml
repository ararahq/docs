          type: object
          additionalProperties: true
        profilePhotoUrl: { type: string }
        awayMessage: { type: string }

    BusinessProfileResponse:
      type: object
      required: [metaSyncStatus]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        displayName:
          type: string
          nullable: true
        vertical:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        aboutShort:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        websites:
          type: array
          nullable: true
          items: { type: string }
        businessHours:
          type: object
          nullable: true
          additionalProperties: true
        profilePhotoUrl:
          type: string
          nullable: true
        awayMessage:
          type: string
          nullable: true
        metaSyncStatus: { type: string }
        metaSyncedAt:
          type: string
          format: date-time
          nullable: true
        metaSyncError:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    # ---------- Wallet ----------
    WalletBalanceResponse:
      type: object
      required: [balance, currency, mode]
      properties:
        balance:
          type: number
          description: Saldo em reais.
        currency: { type: string, example: BRL }
        mode: { type: string, example: LIVE }

    WalletTransaction:
      type: object
      required: [id, amount, type, mode, hasReceipt]
      properties:
        id: { type: string }
        amount:
          type: number
          description: Valor em reais.
        type:
          type: string
          enum: [CHARGE, REFUND, TOPUP, BONUS, DEPOSIT, USAGE, SUBSCRIPTION_FEE, ADMIN_DEBIT]
        description:
          type: string
          nullable: true
        referenceId:
          type: string
          nullable: true
        mode: { type: string, example: LIVE }
        createdAt:
          type: string
          format: date-time
          nullable: true
        hasReceipt: { type: boolean }

    WalletTransactionPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    AutoRechargeSettings:
      type: object
      required: [enabled, threshold, amount]
      properties:
        enabled: { type: boolean }
        threshold:
          type: number
          description: Saldo (R$) que dispara a recarga.
        amount:
          type: number
          description: Valor da recarga (R$).
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastFailureReason:
          type: string
          nullable: true

    UpdateAutoRechargeRequest:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
        threshold:
          type: number
          nullable: true
          minimum: 5
          maximum: 1000
        amount:
          type: number
          nullable: true
          minimum: 20
          maximum: 5000

    RechargeEstimate:
      type: object
      required: [amountCents, planLabel, limits, firstRechargeBonus, estimates]
      properties:
        amountCents: { type: integer }
        planLabel: { type: string }
        limits:
          type: object
          properties:
            minCents: { type: integer }
            maxCents: { type: integer }
        firstRechargeBonus:
          type: object
          properties:
            applicable: { type: boolean }
            percent: { type: integer }
            bonusCents: { type: integer }
            totalCreditCents: { type: integer }
        estimates:
          type: object
          description: Chaves `marketing`, `utility` e `authentication`.
          additionalProperties:
            type: object
            properties:
              count: { type: integer }
              unitPriceCents: { type: integer }

    # ---------- Pricing ----------
    PricingResponse:
      type: object
      required: [currency, model, categories, markets]
      properties:
        currency: { type: string, example: BRL }
        model: { type: string, example: PER_MESSAGE_BY_MARKET }
        categories:
          type: array
          items:
            type: object
            required: [category, priceBrl, source]
            properties:
              category:
                type: string
                enum: [MARKETING, UTILITY, AUTHENTICATION]
              priceBrl: { type: number }
              source: { type: string, example: PLAN_REFERENCE }
        markets:
          type: array
          items:
            type: object
            required: [market, category, costUsd]
            properties:
              market: { type: string }
              category: { type: string }
              costUsd: { type: number }

    PlanInfoResponse:
      type: object
      required: [current, monthlyPriceCents, marketingPriceCents, utilityPriceCents, authPriceCents, features]
      properties:
        current:
          type: string
          enum: [FREE, POC, DECOLAGEM, ESSENTIAL, VOO_SOLO, VOO, VOO_ASSISTIDO, PRO, ENTERPRISE]
        monthlyPriceCents: { type: integer }
        marketingPriceCents: { type: integer }
        utilityPriceCents: { type: integer }
        authPriceCents: { type: integer }
        features:
          type: array
          items: { type: string }
        nextBillingAt:
          type: string
          format: date-time
          nullable: true

    # ---------- Phone lookup ----------
    LookupResult:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string }
        isMobile:
          type: boolean
          nullable: true
        lineType:
          type: string
          nullable: true
        carrier:
          type: string
          nullable: true
        hasWhatsapp:
          type: boolean
          nullable: true
        costCharged:
          type: number
          nullable: true
        error:
          type: string
          nullable: true
          description: '`INSUFFICIENT_FUNDS` ou `FAILED` no lote.'

    # ---------- Recovery ----------
    RecoveryEndpointResponse:
      type: object
      required: [code, hmacSecret, active, url]
      properties:
        code: { type: string }
        hmacSecret:
          type: string
          description: Segredo HMAC da ingestão. Trate como senha.
        active: { type: boolean }
        url:
          type: string
          description: URL pública de ingestão (`.../l/{code}`).

    RecoveryEventConfigResponse:
      type: object
      required: [eventType, active]
      properties:
        eventType: { type: string }
        templateId:
          type: string
          format: uuid
          nullable: true
        templateName:
          type: string
          nullable: true
        active: { type: boolean }
        lastTriggeredAt:
          type: string
          format: date-time
          nullable: true
        templateStatus:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true

    RecoveryEventConfigPatchRequest:
      type: object
      properties:
        templateId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
          nullable: true
        variableMapping:
          type: object
          nullable: true
          additionalProperties: { type: string }

    RecoveryEventsListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryEventConfigResponse'

    RecoveryIngestResult:
      type: object
      required: [ingestId, status]
      properties:
        ingestId: { type: string }
        status: { type: string }
        reason:
          type: string
          nullable: true
        messageId:
          type: string
          nullable: true

    # ---------- Dashboard ----------
    DashboardMessageItem:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [PENDING, SCHEDULED, PROCESSING, SENT_TO_PROVIDER, SENT, DELIVERED, READ, FAILED, CANCELED]
        mode: { type: string }
        sender: { type: string }
        receiver: { type: string }
        messageType: { type: string }
        templateName: { type: string }
        templateSid: { type: string }
        templateLanguage: { type: string }
        providerSid: { type: string }
        errorDetails: { type: string }
        scheduledAt: { type: string }
        externalReference: { type: string }
        deliveredAt: { type: string }
        readAt: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        cost: { type: number }

    DashboardMessageDetail:
      allOf:
        - $ref: '#/components/schemas/DashboardMessageItem'
        - type: object
          properties:
            templateVariablesJson: { type: string }
            body: { type: string }
            processedContent: { type: string }
            mediaUrl: { type: string }
            direction: { type: string }
            processingStart: { type: string }
            processingEnd: { type: string }

    DashboardMessagesResponse:
      type: object
      required: [messages, total, page, size, totalPages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMessageItem'
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        totalPages: { type: integer }

    MetricsWindow:
      type: object
      properties:
        total: { type: integer, format: int64 }
        sent: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        read: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        deliveryRate:
          type: string
          description: Percentual formatado em string.
        totalCost: { type: number }

    DashboardMetricsResponse:
      allOf:
        - $ref: '#/components/schemas/MetricsWindow'
        - type: object
          properties:
            since:
              type: string
              description: Data da primeira mensagem (vazio sem histórico).
            window7d:
              $ref: '#/components/schemas/MetricsWindow'
            previous7d:
              $ref: '#/components/schemas/MetricsWindow'
            mode: { type: string, example: LIVE }

    # ---------- Legacy ----------
    CartAbandonedWebhookRequest:
      type: object
      required: [event, phone, checkout_url]
      properties:
        event:
          type: string
          enum: [cart.abandoned, payment.failed, pix.created, boleto.due]
        name:
          type: string
          nullable: true
        phone: { type: string }
        total:
          type: number
          nullable: true
        checkout_url: { type: string }
        minutes_without_payment:
          type: integer
          nullable: true
        pix_qr_code:
          type: string
          nullable: true
          description: Obrigatório quando `event = pix.created`.

    CartAbandonedWebhookResponse:
      type: object
      required: [status, received_at]
      properties:
        status: { type: string }
        message_id:
          type: string
          format: uuid
          nullable: true
        received_at:
          type: string
          format: date-time

    # ---------- Health ----------
    HealthResponse:
      type: object
      required: [status, timestamp, service]
      properties:
        status: { type: string, example: UP }
        timestamp: { type: string, format: date-time }
        service: { type: string, example: arara-api }
