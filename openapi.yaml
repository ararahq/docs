        windowExpiresAt:
          type: string
          format: date-time
          nullable: true
        hoursRemaining:
          type: number
          nullable: true
        conversationId:
          type: string
          format: uuid
          nullable: true

    WindowStatusResponse:
      type: object
      required: [results, truncated]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WindowStatusItem'
        truncated: { type: boolean }

    # ---------- Smart links ----------
    CreateSmartLinkRequest:
      type: object
      required: [name, phoneNumber]
      properties:
        name: { type: string }
        phoneNumber: { type: string }
        defaultText:
          type: string
          nullable: true
        qrCodeColor:
          type: string
