      description: 'Perfil comercial salvo na Arara e o estado da publicação no WhatsApp. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Números]
      operationId: updateBusinessProfile
      summary: Atualizar perfil comercial
      description: |
        Salva localmente e marca `metaSyncStatus = PENDING`. Para publicar no
        WhatsApp, chame `/sync`. Permissão: `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfilePatch'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'
        '400':
          description: '`INVALID_VERTICAL`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/organizations/me/business-profile/sync:
    post:
      tags: [Números]
      operationId: syncBusinessProfile
      summary: Publicar perfil comercial
      description: 'Envia para o WhatsApp o perfil salvo em `PATCH /v1/organizations/me/business-profile`. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Resultado da publicação
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Perfil ainda não criado (sem corpo).

        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- CARTEIRA ----------------------
  /dashboard/wallet/balance:
    get:
      tags: [Carteira]
      operationId: getWalletBalance
      summary: Consultar saldo
      description: 'Saldo da carteira da organização, em reais (decimal). Permissão: `ADMIN`.'
      responses:
        '200':
          description: Saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/wallet/transactions:
    get:
      tags: [Carteira]
      operationId: listWalletTransactions
      summary: Listar extrato
      description: 'Mais recentes primeiro. Permissão: `ADMIN`.'
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página do extrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/wallet/auto-recharge:
    get:
      tags: [Carteira]
      operationId: getAutoRecharge
      summary: Consultar recarga automática
      description: 'Estado da recarga automática: ligada ou não, limite de saldo e valor da recarga. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Configuração
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoRechargeSettings'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Organização sem carteira (sem corpo).
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Carteira]
      operationId: updateAutoRecharge
      summary: Configurar recarga automática
      description: |
        Ativar exige cartão cadastrado (`409 CONFLICT` sem ele). Se o saldo já
        estiver no limite ao ativar, a cobrança acontece na hora.
        Permissão: `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutoRechargeRequest'
      responses:
        '200':
          description: Configuração atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoRechargeSettings'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/wallet/calculate:
    get:
      tags: [Carteira]
      operationId: calculateRecharge
      summary: Simular recarga
      description: |
        `amountCents` fora de 2.000 a 5.000.000 é ajustado ao limite mais
        próximo. Permissão: `ADMIN`.
      parameters:
        - in: query
          name: amountCents
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Simulação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeEstimate'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/pricing/current:
    get:
      tags: [Carteira]
      operationId: getCurrentPricing
      summary: Consultar preços
      description: |
        `categories` traz o preço de referência (BRL) no mercado local; o valor
        cobrado depende do país de destino. `markets` traz o custo Meta em USD.
        Permissão: `ADMIN`.
      parameters:
        - in: query
          name: market
          required: false
          schema: { type: string }
          description: Filtra `markets` por um mercado.
      responses:
        '200':
          description: Preços
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- CONSULTA DE TELEFONE ----------------------
  /v1/phone-lookup:
    post:
      tags: [Consulta de telefone]
      operationId: phoneLookup
      summary: Consultar telefone
      description: 'Cobra R$ 0,05 por consulta na carteira. Permissão: `ADMIN`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber: { type: string }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResult'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PaymentRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/phone-lookup/batch:
    post:
      tags: [Consulta de telefone]
      operationId: phoneLookupBatch
      summary: Consultar telefones em lote
      description: |
        Processa em série. Ao faltar saldo, para de cobrar e marca as linhas
        restantes com `error = INSUFFICIENT_FUNDS`. Permissão: `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumbers]
              properties:
                phoneNumbers:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema:
                type: object
                required: [results, totalCharged, insufficientFunds]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/LookupResult'
                  totalCharged: { type: number }
                  insufficientFunds: { type: boolean }
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- RECUPERAÇÃO ----------------------
  /v1/recovery/endpoint:
    get:
      tags: [Recuperação]
      operationId: getRecoveryEndpoint
      summary: Consultar endpoint de recuperação
      description: 'Devolve o `hmacSecret`: trate como segredo. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEndpointResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Recuperação]
      operationId: patchRecoveryEndpoint
      summary: Ativar ou desativar endpoint
      description: 'Liga ou desliga o recebimento de eventos de recuperação. Permissão: `ADMIN`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEndpointResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/recovery/endpoint/regenerate:
    post:
      tags: [Recuperação]
      operationId: regenerateRecoveryEndpoint
      summary: Gerar novo segredo
      description: 'Troca o segredo HMAC do endpoint. O segredo antigo para de valer na hora. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEndpointResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/recovery/events:
    get:
      tags: [Recuperação]
      operationId: listRecoveryEvents
      summary: Listar eventos de recuperação
      description: 'Configuração de cada tipo de evento de recuperação (template, espera, ativo). Permissão: `ADMIN`.'
      responses:
        '200':
          description: Configurações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEventsListResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/recovery/events/{eventType}:
    put:
      tags: [Recuperação]
      operationId: upsertRecoveryEventConfig
      summary: Configurar evento de recuperação
      description: |
        Deixar ativa conta contra o limite de automações do plano
        (`PLAN_LIMIT_REACHED`). Permissão: `ADMIN`.
      parameters:
        - in: path
          name: eventType
          required: true
          schema: { type: string }
          description: 'Ex.: `cart.abandoned`, `pix.created`, `payment.failed`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEventConfigPatchRequest'
      responses:
        '200':
          description: Configuração
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEventConfigResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/recovery/events/{eventType}/test:
    post:
      tags: [Recuperação]
      operationId: testRecoveryEvent
      summary: Testar evento de recuperação
      description: |
        Envia mensagem real para o telefone do usuário dono da chave.
        Permissão: `ADMIN`.
      parameters:
        - in: path
          name: eventType
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryIngestResult'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /webhook/cart:
    post:
      tags: [Recuperação]
      operationId: cartAbandonedWebhook
      deprecated: true
      summary: Enviar carrinho abandonado (legado)
      description: |
        Rota anterior ao endpoint de recuperação. Para integrações novas use
        `/v1/recovery/*`. Permissão: `WEBHOOKS_MANAGE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAbandonedWebhookRequest'
      responses:
        '202':
          description: Aceito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartAbandonedWebhookResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- CONTA ----------------------
  /auth/me:
    get:
      tags: [Conta]
      operationId: getCurrentUser
      summary: Consultar usuário da chave
      description: |
        Devolve o usuário dono da chave. Serve para conferir, no início da
        integração, se a chave configurada é a esperada. Permissão: `ADMIN`.
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /auth/me/organizations:
    get:
      tags: [Conta]
      operationId: getMyOrganizations
      summary: Listar organizações da chave
      description: |
        Organizações do usuário dono da chave, na ordem em que ele entrou. A chave
        sempre age sobre a organização principal desse usuário. Permissão: `ADMIN`.
      responses:
        '200':
          description: Organizações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/organizations/me/plan:
    get:
      tags: [Conta]
      operationId: getOrganizationPlan
      summary: Consultar plano
      description: 'Valores em centavos. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Plano
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanInfoResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /health:
    get:
      tags: [Conta]
      operationId: health
      summary: Verificar status da API
      security: []
      responses:
        '200':
          description: Serviço no ar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

      description: Diz se a API está no ar. Não exige chave.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ara_live_...
      description: 'Chave de API da Arara (`ara_live_...`), enviada no header `Authorization: Bearer ara_live_...`. Crie e gerencie as chaves no painel: https://app.ararahq.com/dashboard/apikeys. O valor completo aparece uma única vez, na criação.'

  parameters:
    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 255 }
      description: 'Chave de idempotência, de 1 a 255 caracteres, sem caracteres de controle (fora disso: `400 INVALID_IDEMPOTENCY_KEY`). Derive de um evento do seu sistema (id do pedido, id da tentativa) e reuse a mesma chave nas retentativas.'
      example: pedido-12345-confirmacao

    WabaIdHeader:
      in: header
      name: X-Waba-Id
      required: false
      schema: { type: string, format: uuid }
      description: Restringe o resultado a uma conta WhatsApp Business (WABA) da organização.

    TemplateId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: ID do template (UUID). O nome não é aceito aqui.

    CampaignId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: ID da campanha.

    CampaignIdPath:
      in: path
      name: campaignId
      required: true
      schema: { type: string, format: uuid }
      description: ID da campanha.

    PhonePath:
      in: path
      name: phone
      required: true
      schema:
        type: string
        pattern: '^\+[1-9]\d{6,14}$'
      description: Telefone E.164 com `+` (ex. `+5511999999999`).
      example: '+5511999999999'

    AnalyticsPeriod:
      in: query
      name: period
      required: false
      schema:
        type: string
        enum: [7d, 30d, 90d]
        default: 30d
      description: Valor fora da lista é tratado como `30d`.

    Page:
      in: query
      name: page
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
      description: Página, começando em `0`.

    FlowId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: ID do formulário.

    AutomationId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: ID da automação.

  responses:
    BadRequest:
      description: 'Requisição inválida: `VALIDATION_ERROR` (campo obrigatório ausente ou regra do corpo), `INVALID_JSON` (JSON malformado ou tipo errado), `INVALID_PATH_PARAM` ou `INVALID_IDEMPOTENCY_KEY`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: O número do recebedor é obrigatório
              details: {}

    InvalidPhone:
      description: '`INVALID_PHONE`: telefone fora do E.164.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_PHONE
              message: Telefone fora do formato E.164.
              details: {}

    Unauthorized:
      description: |
        Chave inexistente, revogada, expirada, com prefixo errado (`ara_` sem
        `ara_live_`) ou vinda de IP fora da allowlist. O corpo é o JSON padrão do
        Spring, sem `error.code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SpringError'
          example:
            timestamp: '2026-09-15T14:30:00.000+00:00'
            status: 401
            error: Unauthorized
            path: /v1/messages

    PaymentRequired:
      description: '`INSUFFICIENT_FUNDS` (saldo insuficiente na carteira) ou `PLAN_REQUIRED`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INSUFFICIENT_FUNDS
              message: Saldo insuficiente.
              details: {}

    Forbidden:
      description: |
        Dois casos, com corpos diferentes:

        - Autenticação: header `Authorization` ausente, Bearer que não começa com
          `ara_`, chave sem a permissão da rota ou rota que não aceita chave de
          API. Corpo no formato padrão do Spring, sem `error.code`.
        - Regra de negócio, no formato `{ "error": { ... } }`:
          `PLAN_FEATURE_LOCKED`, `PLAN_LIMIT_REACHED`, `ACCOUNT_NOT_ACTIVATED`,
          `NO_DEDICATED_NUMBER`, `ORGANIZATION_SUSPENDED`, `NUMBER_BLOCKED`,
          `FRAUD_SUSPECTED`, `RESOURCE_FORBIDDEN`, `VIEWER_READ_ONLY`.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/SpringError'
          examples:
            regraDeNegocio:
              summary: Regra de negócio
              value:
                error:
                  code: PLAN_FEATURE_LOCKED
                  message: Seu plano não inclui este recurso.
                  details: {}
            autenticacao:
              summary: Sem header ou sem permissão
              value:
                timestamp: '2026-09-15T14:30:00.000+00:00'
                status: 403
                error: Forbidden
                path: /v1/messages

    NotFound:
      description: 'Recurso não encontrado: `TEMPLATE_NOT_FOUND`, `CAMPAIGN_NOT_FOUND` ou `NOT_FOUND`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Recurso não encontrado.
              details: {}

    Conflict:
      description: '`CONFLICT`, `PROVIDER_NOT_RESOLVED` ou `CONCURRENT_MODIFICATION`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: Conflito com o estado atual do recurso.
              details: {}

    UnprocessableEntity:
      description: |
        A requisição é válida, mas uma regra de negócio impede: `RECIPIENT_OPTED_OUT`,
        `INVALID_RECIPIENT`, `TEMPLATE_PAUSED`, `TEMPLATE_NOT_SENDABLE`,
        `TEMPLATE_VARIABLES_MISMATCH`, `CONVERSATION_WINDOW_CLOSED`,
        `SENDER_NOT_ALLOWED`, `UNPROCESSABLE_ENTITY` ou um código de diagnóstico
        `ararahq-*` com `details.diagnostic`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNPROCESSABLE_ENTITY
              message: Não foi possível processar a requisição.
              details: {}

    TooManyRequests:
      description: |
        Limite atingido:

        - `RATE_LIMIT_EXCEEDED`: limite geral da API. Traz `Retry-After` e
          `X-RateLimit-Remaining`.
        - `SEND_RATE_LIMITED`: teto de envio, inclusive o limite diário da chave.
          Traz `Retry-After`.
        - `BATCH_BUSY`: já existe um lote em processamento. Traz `Retry-After`.
        - `MARKETING_FREQUENCY_EXCEEDED`: o contato já recebeu marketing demais
          na janela. **Não** traz `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos a aguardar antes de repetir a chamada, com a mesma `Idempotency-Key`. Ausente em `MARKETING_FREQUENCY_EXCEEDED`.
        X-RateLimit-Remaining:
          schema: { type: integer }
          description: Requisições restantes na janela atual. Presente em `RATE_LIMIT_EXCEEDED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SEND_RATE_LIMITED
              message: Limite de envio atingido. Tente de novo em instantes.
              details: {}

    RateLimited:
      description: '`RATE_LIMIT_EXCEEDED`: limite geral da API (1.200 leituras ou 3.000 escritas por minuto, por usuário da chave).'
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos a aguardar antes de repetir a chamada.
        X-RateLimit-Remaining:
          schema: { type: integer }
          description: Requisições restantes na janela atual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Muitas requisições. Tente de novo em instantes.
              details: {}

    ServiceUnavailable:
      description: |
        Indisponibilidade temporária. Espere o `Retry-After` e repita com a mesma
        `Idempotency-Key`.

        - `SEND_TEMPORARILY_UNAVAILABLE`: o envio não pôde ser aceito agora
          (formato `{ "error": { ... } }`).
        - Autenticação indisponível: a chave não pôde ser conferida. Corpo no
          formato padrão do Spring, com `Retry-After: 5`.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos a aguardar antes de repetir a chamada.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/SpringError'
          example:
            error:
              code: SEND_TEMPORARILY_UNAVAILABLE
              message: Envio temporariamente indisponível. Tente de novo em instantes.
              details: {}

    FlowNotFound:
      description: '`FLOW_NOT_FOUND`: formulário inexistente ou de outra organização.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: FLOW_NOT_FOUND, message: Formulário não encontrado., details: {}}

    FlowStateConflict:
      description: |
        A ação não cabe no estado atual: `FLOW_NOT_DRAFT`, `FLOW_NOT_PUBLISHED`,
        ou `FLOW_NUMBER_GONE` (o número em que o formulário foi criado saiu da
        organização).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: FLOW_NOT_DRAFT, message: Este formulário já foi publicado., details: {}}

    AutomationNotFound:
      description: '`AUTOMATION_NOT_FOUND`: automação inexistente ou de outra organização.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: AUTOMATION_NOT_FOUND, message: Automação não encontrada., details: {}}

    AutomationInvalid:
      description: |
        `AUTOMATION_TRIGGER_INVALID` (gatilho inexistente),
        `AUTOMATION_TRIGGER_CONFIG_INVALID` (`button.replied` sem `replyId`),
        `AUTOMATION_STEP_INVALID` (passo com `type` ou `config` inválido) ou
        `INVALID_JSON`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {code: AUTOMATION_TRIGGER_INVALID, message: Gatilho inválido., details: {}}

    HookUnavailable:
      description: '`HOOK_UNAVAILABLE_FOR_TRIGGER`: só automação com gatilho `webhook` tem link próprio.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ---------- Erros ----------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INSUFFICIENT_FUNDS
              description: Código estável do erro. Use este campo no seu tratamento, não a mensagem.
            message:
              type: string
              nullable: true
              description: Descrição legível, em português. Pode mudar.
            details:
              type: object
              additionalProperties: true

              description: Dados extras do erro. Vazio na maioria dos casos.
      example:
        error:
          code: INSUFFICIENT_FUNDS
          message: Saldo insuficiente.
          details: {}

    SpringError:
      type: object
      description: Corpo padrão do Spring nas falhas de autenticação (`401`, `403` e `503` do filtro de chave). Não tem `error.code`.
      properties:
        timestamp: { type: string, format: date-time }
        status:
          type: integer
          example: 401
        error:
          type: string
          example: Unauthorized
        path:
          type: string
          example: /v1/messages

    Pagination:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          description: Página atual, começando em `0`.
        size:
          type: integer
          description: Itens por página.
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
      example:
        page: 0
        size: 50
        totalElements: 1
        totalPages: 1

    # ---------- Account ----------
    UserResponse:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }
        role:
          type: string
          nullable: true
          description: Hoje sempre `null` nesta rota.
        emailPending:
          type: boolean
          description: Hoje sempre `false` nesta rota.
      example:
        name: Maria Silva
        email: maria@exemplo.com.br
        role: null
        emailPending: false

    OrganizationItem:
      type: object
      required: [id, name, role, mode]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          nullable: true
          description: Identificador legível.
        name: { type: string }
        role:
          type: string
          description: Papel do usuário na organização.
        mode:
          type: string
          enum: [live, test]
          description: '`live` quando a conta do usuário está ativa; `test` enquanto não está.'

    OrganizationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationItem'

    # ---------- Messages ----------
      example:
        data:
          - id: 7f8a1c2d-4e5f-6789-abcd-ef0123456789
            slug: minha-empresa
            name: Minha Empresa
            role: OWNER
            mode: live

    SendMessageRequest:
      type: object
      required: [receiver]
      description: Envie exatamente um entre `templateName`, `body`, `interactive`, `location` e `reaction`.
      properties:
        receiver:
          type: string
          description: |
            Telefone do destinatário. Formato recomendado: E.164 com `+`
            (`+5511999999999`). Também passam `5511999999999` e
            `whatsapp:+5511999999999`. A Arara fica só com os dígitos e exige de 7
            a 15; fora disso, `422 INVALID_RECIPIENT`.
          example: '+5511999999999'
        templateName:
          type: string
          nullable: true
          description: Nome do template aprovado. Pode ser enviado a qualquer hora.
          example: pedido_confirmado
        templateVariables:
          type: array
          nullable: true
          items: { type: string }
          description: |
            Variáveis posicionais do template, na ordem de `{{1}}`, `{{2}}`...
            (alias aceito: `variables`). Em template com mídia no cabeçalho, a URL
            da mídia vai na primeira posição. Não aceita quebra de linha nem tab.
          example: [João, '12345']
        body:
          type: string
          nullable: true
          description: Texto da mensagem. Só com a janela de 24h aberta; fora dela, `422 CONVERSATION_WINDOW_CLOSED`.
        interactive:
          allOf:
            - $ref: '#/components/schemas/InteractivePayload'
          nullable: true
          description: Botões, lista, formulário ou cobrança. Só com a janela de 24h aberta.
        location:
          allOf:
            - $ref: '#/components/schemas/LocationPayload'
          nullable: true
          description: Localização. Só com a janela de 24h aberta.
        reaction:
          allOf:
            - $ref: '#/components/schemas/ReactionPayload'
          nullable: true
          description: Reação com emoji a uma mensagem.
        charge:
          allOf:
            - $ref: '#/components/schemas/ChargePayload'
          nullable: true
          description: Cobrança que acompanha um template com botão `CHARGE`. Use junto com `templateName`.
        sender:
          type: string
          nullable: true
          description: Número da organização que envia. Omitido, usa o número padrão. Número que não é seu responde `422 SENDER_NOT_ALLOWED`.
        replyTo:
          type: string
          nullable: true
          description: ID (`ara_msg_...`) da mensagem citada na resposta.
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Agenda o envio (ISO 8601). Data no futuro deixa a mensagem em
            `SCHEDULED` até o horário. Data no passado envia na hora. Aceita
            também o nome `scheduledAt`.
          example: '2027-01-15T14:00:00-03:00'
        smartLinkParam:
          type: string
          nullable: true
          description: Parâmetro do botão de smart link do template.
        smartLinkUrl:
          type: string
          nullable: true
          description: URL de destino do botão de smart link do template.
        type:
          type: string
          nullable: true
          enum: [template, text, interactive, location, reaction]
          description: Opcional. Quando omitido, é inferido do conteúdo enviado.
        mode:
          type: string
          nullable: true
          enum: [LIVE]
          description: Opcional. Todo envio por chave de API é real (`LIVE`). Não existe modo de teste.
        media_url:
          type: string
          nullable: true
          deprecated: true
          description: Legado (aceita também `mediaUrl`). Use a primeira posição de `templateVariables`.

    MessageResponse:
      type: object
      required: [status, mode, sender, receiver]
      properties:
        id:
          type: string
          nullable: true
          description: ID público da mensagem. Use para consultar e para casar com o webhook.
          example: ara_msg_k9Bf2Xq
        status:
          type: string
          enum: [PENDING, SCHEDULED, PROCESSING, SENT, DELIVERED, READ, FAILED, CANCELED]
          description: |
            Estado atual, sempre em maiúsculas:

            - `PENDING`: criada, na fila.
            - `SCHEDULED`: agendada.
            - `PROCESSING`: em processamento.
            - `SENT`: aceita pelo provedor.
            - `DELIVERED`: entregue no aparelho.
            - `READ`: lida.
            - `FAILED`: falhou. Veja `reason`.
            - `CANCELED`: cancelada antes do envio.

            O webhook `message.status_updated` usa os mesmos estados em
            minúsculas, com `PENDING` virando `queued`.
        mode:
          type: string
          enum: [LIVE]
          description: Todo envio por chave de API é `LIVE`.
        sender:
          type: string
          description: Número que enviou.
        receiver:
          type: string
          description: Número do destinatário.
        body:
          type: string
          nullable: true
          description: Conteúdo final enviado, com as variáveis aplicadas. Pode vir `null`.
        cost:
          type: number
          nullable: true
          description: Custo em reais. Pode vir `null`. Os valores dos exemplos são ilustrativos.
        reason:
          type: string
          nullable: true
          description: Motivo da falha quando `status` é `FAILED`.
      example:
        id: ara_msg_k9Bf2Xq
        status: PENDING
        mode: LIVE
        sender: whatsapp:+5511888888888
        receiver: whatsapp:+5511999999999
        body: Oi João, seu pedido 12345 foi confirmado!
        cost: 0.068
        reason: null

    InteractivePayload:
      type: object
      required: [type, body]
      properties:
        type:
          type: string
          enum: [button, list, flow, charge, charge_status]
          description: |
            - `button`: botões de resposta (`buttons`).
            - `list`: lista de opções (`buttonText` e `sections`).
            - `flow`: abre um formulário (`flowId`).
            - `charge`: cartão de cobrança (`charge`).
            - `charge_status`: baixa de uma cobrança já enviada (`chargeStatus`).
        body:
          type: string
          description: Texto da mensagem.
        buttonText:
          type: string
          nullable: true
          description: Em `list`, texto do botão que abre a lista (obrigatório). Em `flow`, texto do botão que abre o formulário (padrão `Responder`, até 20 caracteres).
        sections:
          type: array
          nullable: true
          description: Só em `list`.
          items:
            $ref: '#/components/schemas/InteractiveSection'
        buttons:
          type: array
          nullable: true
          description: Só em `button`. A resposta do cliente chega pelo webhook `message.received`.
          items:
            $ref: '#/components/schemas/InteractiveButton'
        flowId:
          type: string
          format: uuid
          nullable: true
          description: Só em `flow`. O `id` do formulário, de `GET /v1/flows`.
        charge:
          allOf:
            - $ref: '#/components/schemas/ChargePayload'
          nullable: true
          description: Só em `charge`.
        chargeStatus:
          allOf:
            - $ref: '#/components/schemas/ChargeStatusPayload'
          nullable: true
          description: Só em `charge_status`.

    InteractiveSection:
      type: object
      required: [title, rows]
      properties:
        title: { type: string }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/InteractiveRow'

    InteractiveRow:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          description: Identificador da opção. Volta no webhook quando o cliente escolhe.
        title: { type: string }
        description:
          type: string
          nullable: true

    InteractiveButton:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          description: Identificador do botão. Volta no webhook quando o cliente toca.
        title:
          type: string
          description: Texto do botão.

    LocationPayload:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        name:
          type: string
          nullable: true
          description: Nome do local.
        address:
          type: string
          nullable: true

          description: Endereço exibido.

    ReactionPayload:
      type: object
      required: [emoji, messageId]
      properties:
        emoji:
          type: string
          description: Emoji da reação.
        messageId:
          type: string
          description: ID (`ara_msg_...`) da mensagem que recebe a reação.

    ChargePayload:
      type: object
      required: [referenceId, items]
      description: |
        Cobrança enviada como cartão de pagamento. Valores sempre em centavos.
        Informe um meio de pagamento por cobrança: `pix`, `paymentLink` ou
        `boleto`. O pagamento é gerado no seu banco ou PSP; a Arara só entrega o
        cartão. Guia em [Cobranças](/cobrancas).
      properties:
        referenceId:
          type: string
          description: Seu identificador da cobrança. É com ele que você dá baixa depois.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChargeItem'
        pix:
          type: object
          nullable: true
          required: [code, key, keyType, merchantName]
          properties:
            code:
              type: string
              description: Pix copia e cola (BR Code) gerado no seu banco ou PSP.
            key: { type: string }
            keyType:
              type: string
              enum: [CPF, CNPJ, EMAIL, PHONE, EVP]
            merchantName: { type: string }
        paymentLink:
          type: object
          nullable: true
          required: [url]
          properties:
            url:
              type: string
              description: Link de pagamento, em `https`.
        boleto:
          type: object
          nullable: true
          required: [digitableLine]
          properties:
            digitableLine:
              type: string
              description: Linha digitável do boleto, só dígitos.
        shippingCents:
          type: integer
          format: int64
          default: 0
        discountCents:
          type: integer
          format: int64
          default: 0
        expiresAt:
          type: integer
          format: int64
          nullable: true
          description: Vencimento, em epoch segundos. Pelo menos 5 minutos à frente.
        expiresDescription:
          type: string
          nullable: true
          description: Texto exibido junto do vencimento. Só vale com `expiresAt`.
        imageUrl:
          type: string
          nullable: true
          description: Foto no topo do cartão. Sem ela, vale a do primeiro item com foto.

    ChargeItem:
      type: object
      required: [name, amountCents]
      properties:
        name: { type: string }
        amountCents:
          type: integer
          format: int64
          description: Valor unitário, em centavos.
        quantity:
          type: integer
          default: 1
        id:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
          description: Foto do item. Com foto, o `id` do item é ignorado.

    ChargeStatusPayload:
      type: object
      required: [referenceId, status]
      properties:
        referenceId:
          type: string
          description: O `referenceId` da cobrança enviada.
        status:
          type: string
          enum: [PAID, FAILED, CANCELED, EXPIRED]
        description:
          type: string
          nullable: true

    BatchMessageRequest:
      type: object
      required: [templateName, messages]
      properties:
        templateName:
          type: string
          description: Nome do template aprovado, igual para todo o lote.
        messages:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BatchMessageItem'

          description: De 1 a 1.000 destinatários.

    BatchMessageItem:
      type: object
      required: [receiver]
      properties:
        receiver:
          type: string
          description: Telefone do destinatário, E.164 com `+`.
          example: '+5511999999999'
        templateVariables:
          type: array
          nullable: true
          items: { type: string }
          description: Variáveis posicionais deste destinatário. Aceita o alias `variables`.
        smartLinkParam:
          type: string
          nullable: true
          description: Parâmetro do botão de smart link do template.
        smartLinkUrl:
          type: string
          nullable: true
          description: URL de destino do botão de smart link do template.
        mediaUrl:
          type: string
          nullable: true

          description: URL da mídia do cabeçalho para este destinatário.

    BatchMessageResponse:
      type: object
      required: [batchId, templateName, total, accepted, totalCost, messages]
      properties:
        batchId:
          type: string
          description: Use em `GET /v1/messages?batchId=` para acompanhar o lote.
        templateName: { type: string }
        total:
          type: integer
          description: Destinatários recebidos.
        accepted:
          type: integer
          description: Mensagens aceitas para envio.
        totalCost:
          type: number
          description: Custo total em reais.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/BatchMessageItemResponse'

      example:
        batchId: ara_msg_b7C1d2E
        templateName: pedido_confirmado
        total: 2
        accepted: 2
        totalCost: 0.136
        messages:
          - id: ara_msg_a1B2c3D
            receiver: whatsapp:+5511999999999
            status: PENDING
            cost: 0.068
          - id: ara_msg_e4F5g6H
            receiver: whatsapp:+5511888888888
            status: PENDING
            cost: 0.068

    BatchMessageItemResponse:
      type: object
      required: [receiver, status]
      properties:
        id:
          type: string
          nullable: true
        receiver: { type: string }
        status: { type: string }
        cost:
          type: number
          nullable: true

    # ---------- Templates ----------
    CreateTemplateRequest:
      type: object
      required: [name, category, body]
      properties:
        name:
          type: string
          description: Nome do template. Único por conta WhatsApp Business.
          example: pedido_confirmado
        category:
          type: string
          enum: [MARKETING, UTILITY, AUTHENTICATION]
          description: Categoria avaliada pela Meta. Em `AUTHENTICATION` o conteúdo é fixo (veja a descrição do endpoint).
        body:
          type: string
          description: Texto com variáveis `{{1}}`, `{{2}}`... Não pode começar nem terminar com variável.
        language:
          type: string
          default: pt_BR
          description: Idioma do template.
        header:
          type: string
          nullable: true
          description: 'Cabeçalho: texto simples ou URL de mídia.'
        headerType:
          type: string
          nullable: true
          enum: [text, media, document]
          description: Tipo do cabeçalho.
        footer:
          type: string
          nullable: true
          description: Rodapé.
        buttons:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TemplateButton'
          description: Até 10 botões, com no máximo 2 de link (`URL` + `SMART_LINK`), 1 de telefone e 1 de formulário.
        samples:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: 'Exemplo por número da variável (`{"1": "João"}`). A Meta usa na revisão. Precisa ser objeto: array responde `400 INVALID_JSON`.'
        variableExamples:
          type: array
          nullable: true
          items: { type: string }
          description: Legado. Prefira `samples`.
        carouselCards:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CarouselCard'

          description: Carrossel, de 2 a 10 cards. Todos os cards precisam ter a mesma estrutura de botões.
          minItems: 2
          maxItems: 10

    TemplateButton:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [QUICK_REPLY, URL, PHONE_NUMBER, SMART_LINK, COPY_CODE, FLOW, CHARGE]
          description: |
            - `QUICK_REPLY`: resposta rápida.
            - `URL`: abre um link. Aceita variável no fim da URL.
            - `PHONE_NUMBER`: liga para o número em `phone`.
            - `SMART_LINK`: link rastreável da Arara.
            - `COPY_CODE`: copia um código.
            - `FLOW`: abre o formulário de `flowId`. Um por template.
            - `CHARGE`: botão de cobrança. A cobrança vai no campo `charge` do envio.
        text:
          type: string
          maxLength: 20
          description: Texto do botão, até 20 caracteres.
        url:
          type: string
          nullable: true
          description: Só em `URL` e `SMART_LINK`.
        phone:
          type: string
          nullable: true
          description: Só em `PHONE_NUMBER`.
        flowId:
          type: string
          format: uuid
          nullable: true
          description: Só em `FLOW`. O `id` do formulário, criado no mesmo número do template.
        extraConfig:
          type: object
          nullable: true
          additionalProperties: true

    CarouselCard:
      type: object
      required: [mediaUrl, body]
      properties:
        mediaUrl:
          type: string
          description: URL da imagem ou do vídeo do card.
        body:
          type: string
          description: Texto do card.
        buttons:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TemplateButton'

          description: Até 2 botões por card.

    TemplateResponse:
      type: object
      required: [id, name, formattedName, category, language, providerName, providerTemplateId, providerStatus, availableForSending, structureJson, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: ID do template (UUID).
        name: { type: string }
        formattedName: { type: string }
        category:
          type: string
          description: Categoria atual. A Meta pode mudar a categoria na revisão.
        originalCategory:
          type: string
          nullable: true
          description: Categoria pedida na criação.
        language: { type: string }
        providerName:
          type: string
          example: GUPSHUP
        providerTemplateId: { type: string }
        providerStatus:
          type: string
          example: APPROVED
          description: |
            Status de aprovação:

            - `PENDING`: em revisão.
            - `APPROVED`: pronto para enviar.
            - `REJECTED`: reprovado. Veja `rejectionReason`.
            - `PAUSED`: pausado pela Meta ou pela proteção automática da Arara. O
              envio responde `422 TEMPLATE_PAUSED`.
            - `DISABLED`: desativado. O envio responde `422 TEMPLATE_NOT_SENDABLE`.
        rejectionReason:
          type: string
          nullable: true
        availableForSending:
          type: boolean
          description: '`false` quando o template foi aprovado em um número que a organização não usa mais. Recrie o template no número ativo.'
        unavailableReason:
          type: string
          nullable: true
        bodyPreview:
          type: string
          nullable: true
          description: Corpo do template, com os marcadores de variável.
        structureJson:
          type: object
          additionalProperties: true
        usageGuide:
          type: object
          nullable: true
          additionalProperties: true
        variablesSchema:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Exemplos por número da variável.
