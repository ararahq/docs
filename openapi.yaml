openapi: 3.0.3
info:
  title: API da Arara
  description: |
    API REST da Arara para WhatsApp Business: mensagens, templates, campanhas,
    contatos, conversas, formulários, automações, smart links e carteira.

    Esta especificação cobre só os endpoints que aceitam **chave de API**
    (`Authorization: Bearer ara_live_...`). Rotas usadas apenas pelo painel
    (gestão de chaves, configuração do webhook, pagamentos e perfil pessoal)
    ficam de fora.

    ## Autenticação

    Header `Authorization: Bearer ara_live_...`. Crie a chave em
    https://app.ararahq.com/dashboard/apikeys. As chaves são sempre LIVE:
    mensagens são entregues de verdade e o custo sai da carteira.

    ## Permissões da chave

    Chave criada sem permissões explícitas tem acesso total (`ADMIN`). Chave
    com permissões restritas só alcança:

    - `READ`: `GET` em `/v1/messages`, `/v1/campaigns`, `/v1/templates`,
      `/v1/flows`, `/v1/automations` e `/v1/organizations/me/numbers`.
    - `MESSAGES_SEND`: escrita em `/v1/messages/**`, `POST /v1/media/upload` e
      `POST /v1/flows/{id}/test`.
    - `TEMPLATES_WRITE`: escrita em `/v1/templates/**` e `/v1/flows/**`.
    - `CAMPAIGNS_SEND`: escrita em `/v1/campaigns/**`.
    - `CONTACTS_WRITE`: escrita em `/v1/contacts/**`.
    - `AUTOMATIONS_MANAGE`: escrita em `/v1/automations/**`.
    - `WEBHOOKS_MANAGE`: escrita em `/webhook/**`.

    Qualquer outra rota exige `ADMIN`. Fora do escopo, a resposta é `403`.

    ## Rate limit

    Por usuário da chave: 1.200 leituras (`GET`) por minuto e 3.000 escritas por
    minuto. Toda resposta traz `X-RateLimit-Remaining`. Acima do limite: `429`
    com `Retry-After` e `error.code = RATE_LIMIT_EXCEEDED`. O envio tem limites
    próprios (`SEND_RATE_LIMITED`, `BATCH_BUSY`, `MARKETING_FREQUENCY_EXCEEDED`).

    ## Formato de erro

    ```json
    { "error": { "code": "ERROR_CODE", "message": "Descrição", "details": {} } }
    ```

    Exceções: falha de autenticação (`401`, `403` e `503` do filtro de chave)
    volta no formato padrão do Spring (`timestamp`, `status`, `error`, `path`,
    sem `code`), e alguns `404` e `403` voltam sem corpo.
  version: 2.1.0
  contact:
    name: AraraHQ
    url: https://ararahq.com
    email: oi@ararahq.com

servers:
  - url: https://api.ararahq.com
    description: Produção

security:
  - bearerAuth: []

tags:
  - name: Mensagens
    description: Envio, consulta e histórico de mensagens de WhatsApp, e upload de mídia.
  - name: Conversas
    description: Conversas com cada telefone, resposta dentro da janela de 24h e situação da janela.
  - name: Templates
    description: Criação, listagem, status de aprovação e métricas de templates.
  - name: Campanhas
    description: Envio do mesmo template para muitos contatos, com estimativa, agendamento, cancelamento e teste A/B.
  - name: Contatos
    description: Base de contatos da organização e direitos do titular (LGPD).
  - name: Opt-out
    description: Registro e consulta de quem pediu para não receber mensagens.
  - name: Formulários
    description: Formulários nativos do WhatsApp (Flows) e as respostas recebidas. Disponíveis do plano Voo para cima.
  - name: Automações
    description: Sequências de passos que rodam sozinhas para cada contato que entra por um gatilho. Exigem plano com recuperação de receita.
  - name: Smart Links
    description: Links wa.me rastreáveis, com QR code.
  - name: Números
    description: Números de WhatsApp da organização e o perfil comercial exibido no WhatsApp.
  - name: Carteira
    description: Saldo, extrato, recarga automática e preços.
  - name: Consulta de telefone
    description: Consulta de tipo de linha e de WhatsApp de um número (cobrada).
  - name: Recuperação
    description: Endpoint de recuperação de receita (carrinho abandonado, Pix, boleto).
  - name: Conta
    description: Identidade da chave, plano da organização e status da API.
paths:

  # ---------------------- MENSAGENS ----------------------
  /v1/messages:
    post:
      tags: [Mensagens]
      operationId: sendMessage
      summary: Enviar mensagem
      description: |
        Envia uma mensagem de WhatsApp. Mande exatamente **um** conteúdo:
        `templateName`, `body`, `interactive`, `location` ou `reaction`. Zero ou
        mais de um responde `400 VALIDATION_ERROR`.

        - Template aprovado (`templateName`) pode ser enviado a qualquer hora.
        - Os demais conteúdos só passam com a janela de 24h aberta. Fora dela:
          `422 CONVERSATION_WINDOW_CLOSED`.

        A resposta `202` traz o `id` da mensagem. O status final chega pelo webhook
        `message.status_updated`.

        `Idempotency-Key` (opcional): a mesma chave, para o mesmo usuário, devolve a
        mensagem já criada, sem novo envio nem nova cobrança. A chave não expira e o
        corpo **não** é comparado: reusar a chave com outro destinatário devolve a
        mensagem antiga, sem erro. Use uma chave por intenção de envio, derivada de
        um evento do seu sistema (ex. `pedido-12345-confirmacao`).

        Permissão: `MESSAGES_SEND`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              template:
                summary: Template aprovado
                value:
                  receiver: '+5511999999999'
                  templateName: pedido_confirmado
                  templateVariables: [João, '12345']
              texto:
                summary: Texto na janela de 24h
                value:
                  receiver: '+5511999999999'
                  body: Já vou te responder, só preciso checar uma coisa.
              midia:
                summary: Template com mídia no cabeçalho
                value:
                  receiver: '+5511999999999'
                  templateName: fatura_disponivel
                  templateVariables: ['https://meusite.com/fatura.pdf', João, Janeiro]
              agendada:
                summary: Mensagem agendada
                value:
                  receiver: '+5511999999999'
                  templateName: lembrete_consulta
                  templateVariables: [amanhã às 14h]
                  scheduled_at: '2027-01-15T14:00:00-03:00'
              botoes:
                summary: Botões de resposta
                value:
                  receiver: '+5511999999999'
                  interactive:
                    type: button
                    body: Qual a sua dúvida?
                    buttons:
                      - {id: rastreio, title: Rastrear pedido}
                      - {id: troca, title: Trocar produto}
              lista:
                summary: Lista de opções
                value:
                  receiver: '+5511999999999'
                  interactive:
                    type: list
                    body: Escolha o setor
                    buttonText: Ver setores
                    sections:
                      - title: Atendimento
                        rows:
                          - id: vendas
                            title: Vendas
                            description: Planos e preços
                          - {id: suporte, title: Suporte}
              formulario:
                summary: Formulário
                value:
                  receiver: '+5511999999999'
                  interactive:
                    type: flow
                    flowId: 0b7e6a52-3c1d-4f7a-9a55-2f4f6f1f9c10
                    body: Pode responder rapidinho por aqui?
                    buttonText: Responder
              localizacao:
                summary: Localização
                value:
                  receiver: '+5511999999999'
                  location:
                    latitude: -23.5613
                    longitude: -46.6565
                    name: Loja Paulista
                    address: Av. Paulista, 1000
              reacao:
                summary: Reação
                value:
                  receiver: '+5511999999999'
                  reaction:
                    emoji: "👍"
                    messageId: ara_msg_k9Bf2Xq
      responses:
        '202':
          description: Mensagem aceita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PaymentRequired'}
        '403':
          description: |
            - Autenticação (corpo padrão do Spring): header ausente ou chave sem
              `MESSAGES_SEND`.
            - `ACCOUNT_NOT_ACTIVATED`: conta ainda não ativada. Com
              `details.reason = FIRST_SUBSCRIPTION_REQUIRED`, falta a primeira
              assinatura.
            - `ORGANIZATION_SUSPENDED`, `FRAUD_SUSPECTED`, `PLAN_FEATURE_LOCKED`.
            - `NUMBER_BLOCKED`: destinatário que falhou repetidas vezes (inválido ou
              sem WhatsApp).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/SpringError'
              example:
                error:
                  code: ACCOUNT_NOT_ACTIVATED
                  message: Ative a conta para enviar mensagens.
                  details: { reason: FIRST_SUBSCRIPTION_REQUIRED }
        '409':
          description: |
            - `CONFLICT`: template não encontrado na organização.
            - `PROVIDER_NOT_RESOLVED`: o número de envio não está pronto para enviar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: Template 'pedido_confirmado' não encontrado.
                  details: {}
        '422':
          description: |
            - `INVALID_RECIPIENT`: telefone inválido (precisa ter de 7 a 15 dígitos).
            - `RECIPIENT_OPTED_OUT`: o destinatário pediu para não receber.
            - `CONVERSATION_WINDOW_CLOSED`: conteúdo fora de template com a janela de
              24h fechada.
            - `TEMPLATE_PAUSED`, `TEMPLATE_NOT_SENDABLE`, `TEMPLATE_VARIABLES_MISMATCH`:
              template pausado, não aprovado ou com número de variáveis diferente.
            - `SENDER_NOT_ALLOWED`: `sender` não pertence à organização ou não pode ser
              usado.
            - `UNPROCESSABLE_ENTITY`: outras regras de envio sem código próprio.
            - `ararahq-*`: falha reconhecida do provedor, com `details.diagnostic`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONVERSATION_WINDOW_CLOSED
                  message: A janela de 24h está fechada. Envie um template.
                  details: {}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      tags: [Mensagens]
      operationId: getBatchMessages
      summary: Listar mensagens de um lote
      description: |
        Devolve as mensagens criadas por `POST /v1/messages/batch`, no mesmo formato
        do envio. `batchId` é obrigatório. Para o histórico completo da organização,
        use `GET /dashboard/messages`. Permissão: `READ`.
      parameters:
        - in: query
          name: batchId
          required: true
          schema: { type: string }
          description: O `batchId` devolvido por `POST /v1/messages/batch`.
      responses:
        '200':
          description: Mensagens do lote
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
              example:
                - id: ara_msg_a1B2c3D
                  status: DELIVERED
                  mode: LIVE
                  sender: whatsapp:+5511888888888
                  receiver: whatsapp:+5511999999999
                  body: Oi João, seu pedido 1 foi confirmado!
                  cost: 0.068
                  reason: null
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/messages/batch:
    post:
      tags: [Mensagens]
      operationId: sendBatchMessages
      summary: Enviar lote de mensagens
      description: |
        Envia o mesmo template para até 1.000 destinatários em uma chamada. Para
        mais que isso, use Campanhas.

        O lote é tudo ou nada: um telefone inválido ou saldo insuficiente recusa o
        lote inteiro com `422 UNPROCESSABLE_ENTITY`.

        Com `Idempotency-Key`, repetir a chamada devolve o lote original sem
        reenviar. Acompanhe o lote em `GET /v1/messages?batchId=`.

        Permissão: `MESSAGES_SEND`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMessageRequest'
            example:
              templateName: pedido_confirmado
              messages:
                - receiver: '+5511999999999'
                  templateVariables: [João, '1']
                - receiver: '+5511888888888'
                  templateVariables: [Maria, '2']
      responses:
        '202':
          description: Lote aceito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMessageResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: |
            - `CONFLICT`: template não encontrado na organização.
            - `PROVIDER_NOT_RESOLVED`: o número de envio não está pronto para enviar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: Template 'pedido_confirmado' não encontrado.
                  details: {}
        '422':
          description: '`UNPROCESSABLE_ENTITY`: algum telefone inválido ou saldo insuficiente para o lote. Nada é enviado. Também os códigos de template (`TEMPLATE_PAUSED`, `TEMPLATE_NOT_SENDABLE`, `TEMPLATE_VARIABLES_MISMATCH`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: Saldo insuficiente para o lote.
                  details: {}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/messages/{id}:
    get:
      tags: [Mensagens]
      operationId: getMessage
      summary: Consultar mensagem
      description: |
        Devolve a mensagem no mesmo formato do envio, com `status` e `reason`
        atualizados. Em produção, prefira o webhook `message.status_updated` a
        consultar em laço.

        Só devolve mensagens enviadas pelo mesmo usuário dono da chave. Mensagem de
        outro membro da organização responde `403` sem corpo, e ID inexistente
        responde `404` sem corpo. Para qualquer mensagem da organização, use
        `GET /dashboard/messages/{id}`.

        Permissão: `READ`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: ara_msg_k9Bf2Xq
          description: ID da mensagem, como veio no campo `id` do envio (ex. `ara_msg_k9Bf2Xq`).
      responses:
        '200':
          description: Mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Mensagem de outro usuário (sem corpo) ou chave sem permissão.
        '404':
          description: Mensagem não encontrada (sem corpo).

        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/media/upload:
    post:
      tags: [Mensagens]
      operationId: uploadMedia
      summary: Enviar arquivo de mídia
      description: |
        Sobe um arquivo para a Arara quando ele não está hospedado em outro lugar.
        Aceita imagem até 5 MB e PDF até 100 MB. Use a `url` devolvida na primeira
        posição de `templateVariables` de um template com mídia no cabeçalho.
        Permissão: `MESSAGES_SEND`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Arquivo salvo
          content:
            application/json:
              schema:
                type: object
                required: [url, directUrl]
                properties:
                  url:
                    type: string
                    description: Link curto público do arquivo.
                  directUrl:
                    type: string
              example:
                url: https://api.ararahq.com/l/Ab3dE9x
                directUrl: https://storage.exemplo.com/fatura.pdf
        '400':
          description: 'Tipo ou tamanho inválido. Corpo `{ "error": "mensagem" }`.'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /dashboard/messages:
    get:
      tags: [Mensagens]
      operationId: getDashboardMessages
      summary: Listar histórico de mensagens
      description: |
        Envelope `{ messages, total, page, size, totalPages }`. Aqui o `status`
        sai sem tradução (inclui `SENT_TO_PROVIDER`). Permissão: `ADMIN`.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, delivered, sent, read, failed, pending]
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Busca textual.
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        '200':
          description: Página de mensagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMessagesResponse'
        '400':
          description: 'Filtro inválido. Corpo `{ "error": "mensagem" }`.'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /dashboard/messages/{id}:
    get:
      tags: [Mensagens]
      operationId: getDashboardMessageDetail
      summary: Consultar mensagem do histórico
      description: |
        Diferente de `GET /v1/messages/{id}`, vale para qualquer mensagem da
        organização e inclui variáveis e corpo. Permissão: `ADMIN`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalhe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMessageDetail'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'Não encontrada. Corpo `{ "error": "Message not found" }`.'

        '429': {$ref: '#/components/responses/RateLimited'}

  /dashboard/metrics:
    get:
      tags: [Mensagens]
      operationId: getDashboardMetrics
      summary: Consultar métricas de envio
      description: 'Totais de envio da organização por janela de tempo. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetricsResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- CONVERSAS ----------------------
  /v1/conversations:
    get:
      tags: [Conversas]
      operationId: listConversations
      summary: Listar conversas
      description: |
        Exige plano com caixa de entrada e número dedicado. Envelope
        `{ content, page, size, totalElements, totalPages }`. Permissão: `ADMIN`.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [OPEN, CLOSED, ARCHIVED]
          description: Filtra por status da conversa.
        - in: query
          name: leadStatus
          required: false
          schema: { type: string }
          description: Filtra pela qualificação do contato.
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [OPEN, EXPIRED]
          description: '`OPEN` só conversas respondíveis; `EXPIRED` só as que exigem template.'
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, default: 20 }
        - $ref: '#/components/parameters/WabaIdHeader'
      responses:
        '200':
          description: Página de conversas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/conversations/{conversationId}/messages:
    get:
      tags: [Conversas]
      operationId: listConversationMessages
      summary: Listar mensagens da conversa
      description: |
        `page=0` traz as mais recentes; dentro da página a ordem é cronológica.
        Permissão: `ADMIN`.
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        '200':
          description: Página de mensagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagesResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Conversa não encontrada (sem corpo).

        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/conversations/reply:
    post:
      tags: [Conversas]
      operationId: replyToConversation
      summary: Responder conversa
      description: |
        Envia texto dentro da janela de 24h de uma conversa. Com a janela expirada,
        responde `400` com `{ "error": "..." }`: envie um template para reabrir.
        Falha no envio aparece em `status: FAILED` e `reason`. Permissão: `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationReplyRequest'
            example:
              conversationId: 3f1c2b4a-5d6e-4f70-8a9b-0c1d2e3f4a5b
              body: Seu pedido sai hoje.
      responses:
        '200':
          description: Resultado do envio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationReplyResponse'
        '400':
          description: 'Janela expirada ou erro de envio. Corpo `{ "error": "mensagem" }`.'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Conversa não encontrada (sem corpo).

        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/conversations/{conversationId}/status:
    patch:
      tags: [Conversas]
      operationId: updateConversationStatus
      summary: Alterar status da conversa
      description: 'Não apaga histórico. Permissão: `ADMIN`.'
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [OPEN, CLOSED, ARCHIVED]
      responses:
        '200':
          description: Status aplicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
        '400':
          description: 'Status inválido. Corpo `{ "error": "mensagem" }`.'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Conversa não encontrada (sem corpo).

        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/conversations/window-status:
    post:
      tags: [Conversas]
      operationId: getWindowStatus
      summary: Consultar janela de 24h
      description: |
        Até 200 telefones por chamada; o excedente é ignorado e `truncated`
        volta `true`. Mande só dígitos com DDI, com ou sem `+`
        (`+5511999999999` ou `5511999999999`). A rota não normaliza como o envio:
        com `whatsapp:`, espaços, parênteses ou hífens o telefone não casa com a
        conversa e a janela volta como fechada. A busca tolera o `+` e o nono
        dígito de celular brasileiro. Permissão: `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowStatusRequest'
            example:
              phones:
                - '5511999999999'
      responses:
        '200':
          description: Situação por telefone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowStatusResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- TEMPLATES ----------------------
  /v1/templates:
    post:
      tags: [Templates]
      operationId: createTemplate
      summary: Criar template
      description: |
        Cria o template e envia para aprovação da Meta. `providerStatus` nasce
        `PENDING`; o resultado chega pelo webhook `template.updated`.

        - O nome é único por conta WhatsApp Business. Repetido: `409 CONFLICT`.
        - Em `AUTHENTICATION` o conteúdo é fixo: a Arara envia à Meta o texto
          `{{1}} é o seu código de verificação` com um botão de copiar código, em
          `pt_BR`. `body`, `buttons` e `language` enviados não mudam o template
          aprovado. No envio, passe o código como única variável.
        - Exige conta ativa (`403 ACCOUNT_NOT_ACTIVATED`).
        - Os planos atuais não têm limite de templates. Contas no plano Free legado
          têm teto de 3 templates aprovados e recebem `403 PLAN_LIMIT_REACHED`.

        Permissão: `TEMPLATES_WRITE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            examples:
              simples:
                summary: Texto com variáveis
                value:
                  name: pedido_confirmado
                  category: UTILITY
                  language: pt_BR
                  body: 'Oi {{1}}, seu pedido {{2}} foi confirmado. Total: R$ {{3}}.'
                  footer: Acompanhe pelo nosso site
                  samples: { '1': João, '2': '12345', '3': '147,90' }
              botoes:
                summary: Com botões
                value:
                  name: pedido_enviado
                  category: UTILITY
                  body: 'Oi {{1}}, seu pedido saiu para entrega.'
                  samples: { '1': João }
                  buttons:
                    - {type: QUICK_REPLY, text: Confirmar}
                    - {type: URL, text: Ver pedido, url: 'https://meusite.com/p/{{1}}'}
              carrossel:
                summary: Carrossel
                value:
                  name: produtos_destaque
                  category: MARKETING
                  body: 'Confira nossas ofertas da semana:'
                  carouselCards:
                    - mediaUrl: https://meusite.com/produto-1.jpg
                      body: Camiseta básica por R$ 79
                      buttons:
                        - {type: URL, text: Comprar, url: 'https://meusite.com/p/1'}
                    - mediaUrl: https://meusite.com/produto-2.jpg
                      body: Tênis de corrida por R$ 299
                      buttons:
                        - {type: URL, text: Comprar, url: 'https://meusite.com/p/2'}
              autenticacao:
                summary: Código de verificação
                value:
                  name: otp_login
                  category: AUTHENTICATION
                  body: Código de verificação
              formulario:
                summary: Botão de formulário
                value:
                  name: captar_contato
                  category: MARKETING
                  body: Oi, conta para a gente o que você procura?
                  buttons:
                    - {type: FLOW, text: Responder, flowId: 0b7e6a52-3c1d-4f7a-9a55-2f4f6f1f9c10}
      responses:
        '201':
          description: Template criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: |
            - Autenticação (corpo padrão do Spring): header ausente ou chave sem
              `TEMPLATES_WRITE`.
            - `ACCOUNT_NOT_ACTIVATED`: conta ainda não ativada.
            - `PLAN_LIMIT_REACHED`: só no plano Free legado, que tem teto de 3
              templates aprovados. Os planos atuais não têm limite.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/SpringError'
              example:
                error:
                  code: PLAN_LIMIT_REACHED
                  message: Limite de templates do plano atingido.
                  details: { feature: TEMPLATES, current: 3, max: 3, currentPlan: FREE, upgradeTo: ESSENTIAL }
        '409':
          description: '`CONFLICT`: já existe um template com esse nome na mesma conta WhatsApp Business, ou o conteúdo foi bloqueado pela moderação da Arara.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: Já existe um template com o nome 'pedido_confirmado'.
                  details: {}
        '422':
          description: '`UNPROCESSABLE_ENTITY`: categoria inválida, variável no começo ou no fim do corpo, botões ou carrossel fora dos limites, exemplos faltando.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: O corpo não pode começar nem terminar com uma variável.
                  details: {}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: Listar templates
      description: |
        Templates da organização, em `{ data, pagination }`.

        `availableForSending: false` indica template aprovado em um número que a
        organização não usa mais. A Meta aprova por conta WhatsApp Business: recrie
        o template no número ativo.

        Permissão: `READ`.
      parameters:
        - in: query
          name: name
          required: false
          schema: { type: string }
          description: Nome exato. Devolve no máximo 1 item.
        - in: query
          name: status
          required: false
          schema:
            type: string
            example: APPROVED
          description: Filtra por `providerStatus` (`APPROVED`, `PENDING`, `REJECTED`, `PAUSED`, `DISABLED`), sem diferenciar maiúsculas.
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: Página, começando em `0`.
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Itens por página. Máximo `200`.
        - $ref: '#/components/parameters/WabaIdHeader'
      responses:
        '200':
          description: Página de templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/templates/{id}:
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: Consultar template
      description: |
        `id` é UUID. Passar o nome no lugar do ID responde `400 INVALID_PATH_PARAM`.
        Para buscar por nome, use `GET /v1/templates?name=`. Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Templates]
      operationId: deleteTemplate
      summary: Apagar template
      description: |
        Irreversível. Apaga primeiro na Meta e depois na Arara; se a Meta recusar,
        nada é apagado. O histórico de envios continua, mas o template sai da
        listagem e não pode mais ser enviado. Permissão: `TEMPLATES_WRITE`.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Apagado
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/templates/{id}/status:
    get:
      tags: [Templates]
      operationId: getTemplateStatus
      summary: Consultar status de aprovação
      description: |
        Devolve o status que a Arara recebeu do provedor, sem nova consulta à Meta.
        Para saber da mudança sem consultar em laço, escute o webhook
        `template.updated`. Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateStatusResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/templates/{id}/analytics:
    get:
      tags: [Templates]
      operationId: getTemplateAnalytics
      summary: Consultar métricas do template
      description: |
        Enviadas, entregues, lidas e falhas do template no período. `sent` soma
        enviadas, entregues e lidas. As taxas vêm como **string** com 1 casa
        decimal, calculadas sobre `sent + failed`. Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/AnalyticsPeriod'
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateAnalyticsResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/templates/analytics:
    get:
      tags: [Templates]
      operationId: getTemplatesAnalytics
      summary: Listar métricas dos templates
      description: |
        Um item por nome de template enviado no período, com os mesmos campos da
        métrica individual (sem `templateId`). Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/AnalyticsPeriod'
      responses:
        '200':
          description: Métricas por template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateAnalyticsBatchItem'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/templates/library:
    get:
      tags: [Templates]
      operationId: listLibraryTemplates
      summary: Listar biblioteca de templates
      description: |
        Templates `UTILITY` que a Meta já aprovou. Exige número conectado
        (`422 GUPSHUP_APP_NOT_READY` sem ele). Permissão: `READ`.
      parameters:
        - in: query
          name: languageCode
          required: false
          schema: { type: string, default: pt_BR }
          description: Idioma dos templates da biblioteca.
      responses:
        '200':
          description: Templates da biblioteca
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryTemplateResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: '`GUPSHUP_APP_NOT_READY`: nenhum número conectado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GUPSHUP_APP_NOT_READY
                  message: Conecte um número antes de usar a biblioteca.
                  details: {}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Templates]
      operationId: createTemplateFromLibrary
      summary: Criar template da biblioteca
      description: |
        Cria um template a partir de um item da biblioteca da Meta. Nasce aprovado,
        sem esperar revisão. Exige número conectado (`422 GUPSHUP_APP_NOT_READY`).
        Permissão: `TEMPLATES_WRITE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryTemplateRequest'
            example:
              name: confirmacao_pedido
              libraryTemplateName: order_confirmation_1
              languageCode: pt_BR
      responses:
        '201':
          description: Template criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`CONFLICT`: já existe um template com esse nome na mesma conta WhatsApp Business.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: Já existe um template com o nome 'confirmacao_pedido'.
                  details: {}
        '422':
          description: '`GUPSHUP_APP_NOT_READY`: nenhum número conectado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GUPSHUP_APP_NOT_READY
                  message: Conecte um número antes de usar a biblioteca.
                  details: {}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/templates/sync:
    post:
      tags: [Templates]
      operationId: syncTemplates
      summary: Sincronizar templates
      description: |
        Importa templates criados direto no gerenciador da Meta e corrige
        status e categoria divergentes. Sem número conectado responde `422`
        `GUPSHUP_APP_NOT_READY`. Permissão: `TEMPLATES_WRITE`.
      responses:
        '200':
          description: Resultado da sincronização
          content:
            application/json:
              schema:
                type: object
                required: [imported, updated, unchanged, skipped]
                properties:
                  imported:
                    type: array
                    items: { type: string }
                  updated:
                    type: array
                    items: { type: string }
                  unchanged: { type: integer }
                  skipped:
                    type: array
                    items: { type: string }
              example:
                imported:
                  - promo_setembro
                updated:
                  - pedido_confirmado
                unchanged: 12
                skipped: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- CAMPANHAS ----------------------
  /v1/campaigns:
    post:
      tags: [Campanhas]
      operationId: createCampaign
      summary: Criar campanha
      description: |
        Cria a campanha, valida template e variáveis, reserva a cota do plano e
        **debita o custo total da carteira** antes de enfileirar. Os envios rodam em
        segundo plano. Contatos bloqueados no envio (opt-out, número inválido,
        limite de frequência) são estornados um a um.

        - `Idempotency-Key` é **obrigatório**. Repetir a chave devolve a campanha já
          criada, sem cobrar de novo. A unicidade da chave é global na Arara, não
          por organização: derive do identificador da campanha no seu sistema, com
          um prefixo só seu (ex. `acme-campanha-8842`).
        - `scheduledAt` agenda o envio, entre 5 minutos e 30 dias à frente. A
          campanha nasce `SCHEDULED`, já cobrada. Fora da janela:
          `400 CAMPAIGN_SCHEDULE_TOO_SOON` ou `400 CAMPAIGN_SCHEDULE_TOO_FAR`.
        - `abTest` cria o teste A/B junto com a campanha. `templateName` é a
          variante A.

        Pré-requisitos: número dedicado conectado (`403 NO_DEDICATED_NUMBER`), saldo
        para o total (`402 INSUFFICIENT_FUNDS`) e cota do plano
        (`403 PLAN_LIMIT_REACHED`).

        Permissão: `CAMPAIGNS_SEND`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 255 }
          description: Identificador único da campanha. Derive do identificador da campanha no seu sistema (ex. `acme-campanha-8842`) e reuse a mesma chave nas retentativas. A unicidade é global na Arara.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
            examples:
              simples:
                summary: Envio imediato
                value:
                  name: Black Friday 2026
                  templateName: bf_oferta_geral
                  contacts:
                    - {to: '+5511999999999', variables: [João, '30']}
                    - {to: '+5511888888888', variables: [Maria, '25']}
              agendada:
                summary: Agendada
                description: Troque `scheduledAt` por uma data entre 5 minutos e 30 dias à frente.
                value:
                  name: Lembrete sexta
                  templateName: lembrete_evento
                  scheduledAt: '2027-01-15T12:00:00-03:00'
                  contacts:
                    - {to: '+5511999999999', variables: [João]}
              testeAB:
                summary: Com teste A/B
                value:
                  name: Reativação
                  templateName: reativacao_copy_a
                  contacts:
                    - {to: '+5511999999999', variables: [João]}
                  abTest:
                    variantBTemplateName: reativacao_copy_b
                    metric: CLICKED
                    samplePct: 20
                    splitPct: 50
                    decisionWindowMinutes: 240
                    autopilot: true
      responses:
        '200':
          description: Campanha criada (ou existente, se a chave já foi usada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: '`VALIDATION_ERROR` (`name`, `templateName` ou `contacts` ausente ou vazio), `CAMPAIGN_SCHEDULE_TOO_SOON` ou `CAMPAIGN_SCHEDULE_TOO_FAR` (`scheduledAt` fora da janela de 5 minutos a 30 dias).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CAMPAIGN_SCHEDULE_TOO_SOON
                  message: Agende para pelo menos 5 minutos à frente.
                  details: {}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PaymentRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: '`UNPROCESSABLE_ENTITY` ou `ararahq-*`: template não encontrado, variáveis incompatíveis ou `sender` inválido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: Template não encontrado.
                  details: {}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500':
          description: 'Requisição sem `Idempotency-Key` responde hoje `500 INTERNAL_SERVER_ERROR`, e não `400`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Campanhas]
      operationId: listCampaigns
      summary: Listar campanhas
      description: |
        Envelope `{ content, totalPages, totalElements }` (não segue o padrão
        `{ data, pagination }`). Permissão: `READ`.
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: Página, começando em `0`.
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Itens por página, de 1 a 100.
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/CampaignStatus'
          description: Filtra por status da campanha.
        - $ref: '#/components/parameters/WabaIdHeader'
      responses:
        '200':
          description: Página de campanhas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/campaigns/estimate:
    get:
      tags: [Campanhas]
      operationId: estimateCampaign
      summary: Estimar custo por quantidade
      description: |
        Usa o preço de referência do mercado local. Para campanha com números
        de vários países, use o `POST`. `templateName` aceita nome ou ID.
        Permissão: `READ`.
      parameters:
        - in: query
          name: templateName
          required: true
          schema: { type: string }
          description: Nome ou ID do template.
        - in: query
          name: count
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
          description: Quantidade de destinatários, de 1 a 1.000.000.
      responses:
        '200':
          description: Estimativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEstimateResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Campanhas]
      operationId: estimateCampaignByPhones
      summary: Estimar custo por lista de telefones
      description: |
        Calcula o preço por país de destino e devolve a quebra em `markets`.
        Não cria nada nem debita. Permissão: `CAMPAIGNS_SEND`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignEstimateRequest'
            example:
              templateName: bf_oferta_geral
              phones:
                - '+5511999999999'
                - '+5511888888888'
      responses:
        '200':
          description: Estimativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEstimateResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/campaigns/{id}:
    get:
      tags: [Campanhas]
      operationId: getCampaign
      summary: Consultar campanha
      description: |
        Campanha com as métricas agregadas. `clickedCount` e `convertedCount`
        dependem de Smart Links. Para acompanhar mensagem a mensagem, use o webhook
        `message.status_updated`; o fim da campanha gera o evento `campaign.completed`.
        Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Detalhe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetailResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/campaigns/{id}/cancel:
    post:
      tags: [Campanhas]
      operationId: cancelCampaign
      summary: Cancelar campanha
      description: |
        Marca `CANCELED` e estorna na carteira os contatos que ainda não viraram
        mensagem. Mensagens já enfileiradas seguem. Campanha em `COMPLETED`,
        `COMPLETED_WITH_ERRORS`, `CANCELED` ou `FAILED` responde `422`.
        Permissão: `CAMPAIGNS_SEND`.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '204':
          description: Cancelada
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/campaigns/{campaignId}/ab-test:
    post:
      tags: [Campanhas]
      operationId: createCampaignAbTest
      summary: Adicionar teste A/B
      description: |
        Prefira o campo `abTest` no `POST /v1/campaigns`: lá o teste nasce junto com
        a campanha. Criado depois, parte dos contatos pode já ter sido enviada sem o
        teste. Nesta rota `variantATemplateName` é obrigatório e o padrão de
        `autopilot` é `false`. Permissão: `CAMPAIGNS_SEND`.
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAbTestRequest'
      responses:
        '201':
          description: Teste criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbTestResponse'
        '400':
          description: '`INVALID_AB_TEST` (métrica ou split inválido).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Campanha não encontrada (sem corpo).
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      tags: [Campanhas]
      operationId: getCampaignAbTest
      summary: Consultar teste A/B
      description: |
        Estado do teste: vencedora, quando e por que foi decidida, e as métricas por
        variante. Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Teste A/B
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbTestResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Campanha ou teste não encontrado (sem corpo).

        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/campaigns/{campaignId}/ab-test/winner:
    post:
      tags: [Campanhas]
      operationId: forceCampaignAbTestWinner
      summary: Definir variante vencedora
      description: |
        Define o vencedor (`decidedReason = FORCED_MANUAL`) e libera os contatos
        que aguardavam o resultado. Permissão: `CAMPAIGNS_SEND`.
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceWinnerRequest'
            example:
              winner: A
      responses:
        '200':
          description: Vencedor aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbTestResponse'
        '400':
          description: '`INVALID_WINNER`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Campanha ou teste não encontrado (sem corpo).

        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- CONTATOS ----------------------
  /v1/contacts:
    get:
      tags: [Contatos]
      operationId: listContacts
      summary: Listar contatos
      description: |
        Contatos da organização, no envelope
        `{ contacts, total, page, size, totalPages }` (não segue o padrão
        `{ data, pagination }`). Exige plano com contatos (`403 PLAN_FEATURE_LOCKED`).
        Permissão: `ADMIN`.
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Busca por nome, telefone ou email.
        - in: query
          name: lifecycle
          required: false
          schema:
            type: string
            enum:
              - ALL
              - NEW
              - ENGAGED
              - SILENT
              - DORMANT
              - OPTED_OUT
          description: Estágio do contato. `ALL` (ou omitido) traz todos.
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: Página, começando em `0`.
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
          description: Itens por página. Máximo `200`.
        - $ref: '#/components/parameters/WabaIdHeader'
      responses:
        '200':
          description: Página de contatos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsListResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/contacts/batch:
    post:
      tags: [Contatos]
      operationId: importContactsBatch
      summary: Importar contatos em lote
      description: |
        Cria ou atualiza até 5.000 contatos por chamada. O corpo é um **array**. O
        telefone é a chave:

        - Telefone novo: cria (`created`).
        - Telefone existente com dados diferentes: atualiza (`updated`).
        - Telefone existente com dados iguais: `skipped`, sem erro.
        - Linha inválida: `skipped` e entra em `errors` com o índice e o motivo.

        No lote, `email` e `attributes` **substituem** o que está gravado: enviar um
        contato existente sem `email` apaga o email dele. Para mudar só um campo,
        use `PATCH /v1/contacts/{phone}`.

        `importId` identifica a chamada nos logs; não há rota para consultá-lo.

        Permissão: `CONTACTS_WRITE`.
      parameters:
        - $ref: '#/components/parameters/WabaIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 5000
              items:
                $ref: '#/components/schemas/ContactRequest'
            example:
              - name: João Silva
                phone: '+5511999999999'
                email: joao@exemplo.com
                attributes: { plano: pro }
              - name: Maria Santos
                phone: '+5511888888888'
      responses:
        '200':
          description: Resultado da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsBatchResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: '`UNPROCESSABLE_ENTITY`: lote vazio ou acima de 5.000 itens.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: O lote aceita de 1 a 5.000 contatos.
                  details: {}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/contacts/stats:
    get:
      tags: [Contatos]
      operationId: getContactsStats
      summary: Consultar estatísticas de contatos
      description: 'Total de contatos e a contagem por estágio (`NEW`, `ENGAGED`, `SILENT`, `DORMANT`, `OPTED_OUT`). Permissão: `ADMIN`.'
      responses:
        '200':
          description: Contagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsStatsResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/contacts/{phone}:
    get:
      tags: [Contatos]
      operationId: getContactByPhone
      summary: Consultar contato
      description: |
        Telefone E.164 com `+`. Contato inexistente responde hoje `422`
        `UNPROCESSABLE_ENTITY`, não `404`. Permissão: `ADMIN`.
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: Contato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: '`UNPROCESSABLE_ENTITY`: contato não encontrado (hoje não responde `404`) ou telefone fora do E.164.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: Contato não encontrado.
                  details: {}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Contatos]
      operationId: updateContact
      summary: Atualizar contato
      description: 'Atualiza só os campos enviados. Campo omitido não muda. Permissão: `CONTACTS_WRITE`.'
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPatchRequest'
            example:
              name: João S.
              tags:
                - vip
                - black-friday
      responses:
        '200':
          description: Contato atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/contacts/{phone}/messages:
    get:
      tags: [Contatos]
      operationId: getContactMessages
      summary: Listar mensagens do contato
      description: 'Últimas mensagens trocadas com o telefone, da mais recente para a mais antiga. Permissão: `ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
          description: Quantidade de mensagens, até 100.
      responses:
        '200':
          description: Mensagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessagesResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/contacts/{phone}/lgpd/export:
    get:
      tags: [Contatos]
      operationId: exportContactLgpd
      summary: Exportar dados do titular
      description: 'Contato, conversa e até 1.000 mensagens. Permissão: `ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: Dados do titular
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LgpdExport'
        '400': {$ref: '#/components/responses/InvalidPhone'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/contacts/{phone}/lgpd:
    delete:
      tags: [Contatos]
      operationId: deleteContactLgpd
      summary: Apagar dados do titular
      description: |
        Irreversível. Mascara o conteúdo das mensagens e da conversa, apaga o
        contato e registra opt-out. Permissão: `CONTACTS_WRITE`.
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - in: query
          name: reason
          required: false
          schema: { type: string, maxLength: 80 }
          description: Motivo do pedido, para o registro de opt-out. Até 80 caracteres.
      responses:
        '200':
          description: Resultado da remoção
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LgpdDeletionResult'
        '400': {$ref: '#/components/responses/InvalidPhone'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- OPT-OUT ----------------------
  /v1/opt-outs:
    get:
      tags: [Opt-out]
      operationId: listOptOuts
      summary: Listar opt-outs
      description: 'Todos os opt-outs da organização, em `{ items, total }`, sem paginação. Permissão: `ADMIN`.'
      responses:
        '200':
          description: Opt-outs
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OptOutItem'
                  total: { type: integer }
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Opt-out]
      operationId: createOptOut
      summary: Registrar opt-out
      description: |
        Registra que o telefone não quer mais receber mensagens da organização.
        Registrar o mesmo telefone de novo devolve o registro existente.

        Atenção: o envio hoje só é bloqueado por opt-out feito por palavra-chave
        recebida no WhatsApp (ex. "SAIR", "PARAR", "STOP"). O opt-out registrado por
        esta rota ou pela remoção LGPD ainda **não** é consultado no envio de
        mensagens e campanhas. Filtre a lista do seu lado antes de enviar.

        Permissão: `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: '+5511999999999'
                  description: Telefone E.164 com `+`.
                reason:
                  type: string
                  maxLength: 80
                  description: Motivo. Cortado em 80 caracteres.
            example:
              phone: '+5511999999999'
              reason: pediu por email
      responses:
        '201':
          description: Opt-out registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutItem'
        '400': {$ref: '#/components/responses/InvalidPhone'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/opt-outs/{phone}:
    get:
      tags: [Opt-out]
      operationId: checkOptOut
      summary: Consultar opt-out
      description: 'Diz se o telefone está em opt-out. Telefone fora do E.164 responde `400 INVALID_PHONE`. Permissão: `ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: Situação
          content:
            application/json:
              schema:
                type: object
                required: [phone, channel, optedOut]
                properties:
                  phone: { type: string }
                  channel:
                    type: string
                    example: WHATSAPP
                  optedOut: { type: boolean }
              example:
                phone: '+5511999999999'
                channel: WHATSAPP
                optedOut: true
        '400': {$ref: '#/components/responses/InvalidPhone'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Opt-out]
      operationId: deleteOptOut
      summary: Remover opt-out
      description: 'Remove o opt-out: o telefone volta a poder receber (opt-in). Permissão: `ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '204':
          description: Removido
        '400': {$ref: '#/components/responses/InvalidPhone'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ---------------------- FORMULÁRIOS ----------------------
  /v1/flows:
    get:
      tags: [Formulários]
      operationId: listFlows
      summary: Listar formulários
      description: |
        Formulários da organização, do mais recente para o mais antigo, em
        `{ data, pagination }`. O `id` de cada item é o `flowId` usado no envio.
        Permissão: `READ`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
          description: Itens por página.
      responses:
        '200':
          description: Página de formulários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Formulários]
      operationId: createFlow
      summary: Criar formulário
      description: |
        Cria o formulário e já publica: quando a chamada volta `201` com
        `status: PUBLISHED`, ele está no ar e não pode mais ser editado. Se só a
        publicação falhar, o formulário fica em `DRAFT` com `publishError`
        preenchido; publique de novo em `POST /v1/flows/{id}/publish`.

        Não aceita `Idempotency-Key`. O nome é único por número, então repetir
        um `POST` que já passou responde `409 FLOW_NAME_TAKEN` em vez de duplicar.

        Disponível do plano Voo para cima. Permissão: `TEMPLATES_WRITE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlowRequest'
            example:
              name: Captar contato
              category: LEAD_GENERATION
              title: Fale com a gente
              intro: Leva menos de um minuto.
              submitLabel: Enviar
              fields:
                - {label: Seu nome, type: TEXT, key: nome}
                - {label: Seu melhor e-mail, type: EMAIL, key: email}
                - label: O que você procura?
                  type: SELECT
                  key: interesse
                  options: [Falar com vendas, Suporte, Parceria]
                - {label: Observações, type: LONG_TEXT, key: obs, required: false}
      responses:
        '201':
          description: Formulário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '400':
          description: '`INVALID_FLOW`: pergunta em branco, opções de menos, chave inválida ou JSON recusado pela Meta. Também `INVALID_JSON`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {code: INVALID_FLOW, message: 'O formulário precisa de 1 a 10 perguntas.', details: {}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`FLOW_NAME_TAKEN` (nome já usado no número) ou `FLOW_NUMBER_REQUIRED` (nenhum número conectado).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {code: FLOW_NAME_TAKEN, message: "Já existe um formulário com o nome 'Captar contato'.", details: {}}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/flows/{id}:
    get:
      tags: [Formulários]
      operationId: getFlow
      summary: Consultar formulário
      description: 'Devolve o formulário com a definição das perguntas e o total de respostas. Permissão: `READ`.'
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Formulário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/FlowNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Formulários]
      operationId: deleteFlow
      summary: Apagar formulário
      description: |
        Só funciona em formulário que nunca foi publicado (`DRAFT`). Publicado
        responde `409 FLOW_NOT_DRAFT`: use `POST /v1/flows/{id}/deprecate`.
        Permissão: `TEMPLATES_WRITE`.
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '204':
          description: Apagado
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/FlowNotFound'}
        '409': {$ref: '#/components/responses/FlowStateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/flows/{id}/publish:
    post:
      tags: [Formulários]
      operationId: publishFlow
      summary: Publicar formulário
      description: |
        Publica um formulário que ficou em `DRAFT` porque a publicação falhou na
        criação. Formulário já publicado responde `409 FLOW_NOT_DRAFT`.
        Permissão: `TEMPLATES_WRITE`.
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Formulário publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/FlowNotFound'}
        '409': {$ref: '#/components/responses/FlowStateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/flows/{id}/deprecate:
    post:
      tags: [Formulários]
      operationId: deprecateFlow
      summary: Desativar formulário
      description: |
        Marca o formulário como `DEPRECATED`. As respostas já recebidas ficam
        guardadas e o botão deixa de abrir para quem recebeu a mensagem antes.
        Só formulário publicado pode ser desativado (`409 FLOW_NOT_PUBLISHED`).
        Permissão: `TEMPLATES_WRITE`.
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Formulário desativado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/FlowNotFound'}
        '409': {$ref: '#/components/responses/FlowStateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/flows/{id}/test:
    post:
      tags: [Formulários]
      operationId: testFlow
      summary: Enviar formulário de teste
      description: |
        Envia o formulário para o telefone do usuário dono da chave. É uma
        mensagem real, dentro da janela de 24h: exige formulário publicado e
        conversa aberta com esse telefone. Permissão: `MESSAGES_SEND`.
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Teste enviado
          content:
            application/json:
              schema:
                type: object
                required: [sentTo]
                properties:
                  sentTo:
                    type: string
                    description: Número que recebeu o teste, com DDI.
              example:
                sentTo: '5511999999999'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/FlowNotFound'}
        '409':
          description: '`FLOW_NOT_PUBLISHED`, `FLOW_TEST_NO_PHONE` (usuário sem telefone), `FLOW_TEST_WINDOW_CLOSED` (janela de 24h fechada) ou `FLOW_TEST_FAILED`.'
          content:
            application/json:
