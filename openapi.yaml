          type: string
          format: date-time
          nullable: true
        clicks: { type: integer, format: int64 }

    SmartLinkPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SmartLinkResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ---------- Numbers ----------
    NumberCard:
      type: object
      required: [id, name, phoneNumber, type, isDefault, status, qualityScore, messagingTier, provider]
      properties:
        id: { type: string }
        name: { type: string }
        alias:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        phoneNumber: { type: string }
        type:
