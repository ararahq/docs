    # ---------- Contacts ----------
    ContactRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nome do contato. Obrigatório, até 255 caracteres.
        phone:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          example: '+5511999999999'
          description: Telefone E.164 com `+`. É a chave do contato.
        email:
          type: string
          maxLength: 255
          nullable: true
          description: No lote, substitui o email gravado. Omitir apaga o email de um contato existente.
        attributes:
          type: object
          nullable: true
          additionalProperties: true

          description: Objeto livre com dados do seu sistema. No lote, substitui o que está gravado.

    ContactPatchRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
          description: Até 255 caracteres. Vazio é ignorado.
        email:
          type: string
          maxLength: 255
          nullable: true
          description: Até 255 caracteres. String vazia remove o email.
        tags:
          type: array
          nullable: true
          maxItems: 20
          items: { type: string }
          description: Substitui a lista inteira. Até 20 tags.

    ContactResponse:
      type: object
      required: [id, name, phone, tags, createdAt, lifecycle, source, outboundCount, inboundCount]
